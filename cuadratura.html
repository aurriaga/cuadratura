// La regla que guía esto: el mejor reporte es el que se explica solo. Cada
// número viene con su lectura en palabras, no solo con un color.
function indicadores(){
  const corte = ymActual(), lista = asientosHasta(corte), m = saldos(lista);
  const sal = c => m[c] ? m[c].debe - m[c].haber : 0;
  const E = esf(lista), r = eri(lista);
  const A = f29Ano(), idx = S.ui.mes;
  const meses = idx + 1;

  const caja = sal('1101') + sal('1102');
  const clientes = sal('1103');
  const proveedores = -sal('2101');
  const impuestos = -(sal('2103') + sal('2105') + sal('2106') + sal('2109') + sal('2110'));
  const corriente = E.pc ? E.ac / E.pc : null;
  const trabajo = E.ac - E.pc;
  const margen = r.ingresos ? r.bruto / r.ingresos : null;
  const neto = r.ingresos ? r.neto / r.ingresos : null;
  // Ingresos por mes tomados de la contabilidad, para que el gráfico sirva
  // tanto si importas del SII como si trabajas con asientos manuales.
  const ventasMes = new Array(meses).fill(0);
  lista.forEach(a=>{
    const mm = +a.fecha.slice(5,7) - 1;
    if(mm < 0 || mm >= meses) return;
    a.lineas.forEach(l=>{
      const t = CTA[l.c];
      if(t && t.tipo === 'ingreso' && t.sub !== 'otros') ventasMes[mm] += num(l.h) - num(l.d);
    });
  });
  const ventaProm = meses ? r.ingresos / meses : 0;
  const conVentas = ventasMes.filter(x=>x>0).length;
  const diasCobro = ventaProm ? clientes / (ventaProm/30) : null;
  const mesesCaja = null;
  const gastoMes = meses ? (r.costo + r.oper + r.fin) / meses : 0;
  const autonomia = gastoMes > 0 ? caja / gastoMes : null;

  const L = [];
  const push = (k,v,fmtv,lectura,estado) => L.push({k, v, fmtv, lectura, estado});

  push('Caja y banco', caja, $$(caja),
    autonomia == null ? 'No hay gastos registrados con los que comparar.'
      : autonomia >= 3 ? 'Alcanza para cubrir unos '+dec(autonomia,1)+' meses de gastos al ritmo actual. Es una posición cómoda.'
      : autonomia >= 1 ? 'Cubre unos '+dec(autonomia,1)+' meses de gastos. Ajustado: conviene tener al menos tres.'
      : 'Cubre menos de un mes de gastos. Es una posición frágil ante cualquier imprevisto.',
    autonomia == null ? 'mute' : autonomia >= 3 ? 'ok' : autonomia >= 1 ? 'warn' : 'bad');

  push('Razón corriente', corriente, corriente == null ? '—' : dec(corriente,2),
    corriente == null ? 'No hay pasivo corriente registrado.'
      : corriente >= 1.5 ? 'Por cada peso que debes a corto plazo tienes '+dec(corriente,2)+' en activos que se hacen líquidos dentro del año. Holgado.'
      : corriente >= 1 ? 'Por cada peso que debes tienes '+dec(corriente,2)+'. Alcanza, pero sin margen para imprevistos.'
      : 'Por cada peso que debes a corto plazo tienes solo '+dec(corriente,2)+'. Hay más deuda próxima a vencer que activos para cubrirla.',
    corriente == null ? 'mute' : corriente >= 1.5 ? 'ok' : corriente >= 1 ? 'warn' : 'bad');

  push('Capital de trabajo', trabajo, $$(trabajo),
    trabajo >= 0 ? 'Te quedan '+fmt(trabajo)+' después de pagar todo lo que vence dentro del año.'
                 : 'Faltan '+fmt(-trabajo)+' para cubrir lo que vence dentro del año con lo que tienes disponible.',
    trabajo >= 0 ? 'ok' : 'bad');

  push('Margen bruto', margen, margen == null ? '—' : pct1(margen),
    margen == null ? 'Todavía no hay ventas registradas.'
      : 'De cada 100 pesos vendidos te quedan '+fmt(margen*100)+' después del costo de la mercadería. Los otros '+fmt(100-margen*100)+' se van en lo que compraste para vender.',
    margen == null ? 'mute' : margen >= 0.25 ? 'ok' : margen >= 0.1 ? 'warn' : 'bad');

  push('Resultado del ejercicio', r.neto, $$(r.neto),
    r.ingresos === 0 ? 'Sin ventas todavía.'
      : r.neto >= 0 ? 'Ganaste '+fmt(neto*100)+' pesos por cada 100 vendidos, después de todos los gastos.'
                    : 'Estás perdiendo '+fmt(-neto*100)+' pesos por cada 100 vendidos. Los gastos superan el margen.',
    r.ingresos === 0 ? 'mute' : r.neto > 0 ? 'ok' : 'bad');

  push('Días de cobro', diasCobro, diasCobro == null ? '—' : Math.round(diasCobro)+' días',
    diasCobro == null ? 'Sin ventas con las que calcularlo.'
      : diasCobro <= 30 ? 'Cobras en unos '+Math.round(diasCobro)+' días desde que vendes. Buen ciclo.'
      : diasCobro <= 60 ? 'Te demoras unos '+Math.round(diasCobro)+' días en cobrar. Cada día de más es plata inmovilizada en tus clientes.'
      : 'Tienes '+fmt(clientes)+' esperando cobro, equivalente a '+Math.round(diasCobro)+' días de venta. Revisa la cobranza.',
    diasCobro == null ? 'mute' : diasCobro <= 30 ? 'ok' : diasCobro <= 60 ? 'warn' : 'bad');

  push('Deuda con proveedores', proveedores, $$(proveedores),
    proveedores === 0 ? 'No hay saldo pendiente con proveedores.'
      : clientes >= proveedores ? 'Debes '+fmt(proveedores)+' y te deben '+fmt(clientes)+'. Lo que te deben alcanza para cubrirlo.'
      : 'Debes '+fmt(proveedores)+' y te deben '+fmt(clientes)+'. La diferencia tienes que ponerla de caja.',
    proveedores === 0 ? 'mute' : clientes >= proveedores ? 'ok' : 'warn');

  push('Impuestos por pagar', impuestos, $$(impuestos),
    impuestos <= 0 ? 'No hay impuestos devengados pendientes.'
      : 'Tienes '+fmt(impuestos)+' devengados entre IVA, retenciones, cotizaciones y provisión de renta. No es plata disponible aunque esté en el banco.',
    impuestos <= 0 ? 'mute' : impuestos > caja ? 'bad' : 'warn');

  return {L, ventasMes, conVentas, E, r, caja, corriente, meses};
}

// Gráfico de ventas por mes, dibujado a mano en SVG para no depender de nada.
function barrasVentas(datos, meses){
  if(!datos.length || !datos.some(x=>x>0)) return '';
  const w = 100, h = 34, max = Math.max(...datos), n = datos.length;
  const bw = w/n;
  const barras = datos.map((v,i)=>{
    const bh = max ? (v/max)*h : 0;
    return `<rect x="${(i*bw+bw*0.15).toFixed(2)}" y="${(h-bh).toFixed(2)}" width="${(bw*0.7).toFixed(2)}" height="${Math.max(bh,0.4).toFixed(2)}" fill="${i===n-1?'var(--ok)':'var(--bar)'}" />`;
  }).join('');
  const etiq = datos.map((v,i)=>`<text x="${(i*bw+bw/2).toFixed(2)}" y="${h+5}" font-size="3.2" fill="var(--ink3)" text-anchor="middle">${MESES[i].slice(0,3)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h+7}" style="width:100%;height:auto;display:block;margin:8px 0 2px">${barras}${etiq}</svg>`;
}

function previewDoc(clase){
  const monto = num(val('f_monto')), modo = val('f_modo')||'neto';
  const tIla = clase==='honorario' ? 0 : (parseFloat(val('f_ila'))||0);
  const ano = +((val('f_fecha')||hoyISO()).slice(0,4));
  if(clase==='honorario'){
    const ret = R(monto*tasaRet(ano));
    return {neto:monto, exento:0, iva:0, ila:0, retencion:ret, total:monto,
            txt:`Honorario bruto ${$$(monto)} · retención ${pct(tasaRet(ano))} ${$$(ret)} · líquido a pagar ${$$(monto-ret)}. El gasto es el bruto.`};
  }
  const ex = num(val('f_exento'));
  const x = descomponer(monto, modo, tIla);
  const total = x.neto + x.iva + x.ila + ex;
  const partes = [`neto ${$$(x.neto)}`, `IVA 19% ${$$(x.iva)}`];
  if(tIla) partes.push(`adicional ${pct(tIla)} ${$$(x.ila)}`);
  if(ex) partes.push(`exento ${$$(ex)}`);
  return {neto:x.neto, exento:ex, iva:x.iva, ila:x.ila, retencion:0, total,
          txt: partes.join(' · ') + ` → total ${$$(total)}`};
}

function bindImport(){

    imp.an = analizarImport(imp.txt, imp.clase || null, S.emp.ejercicio, imp.filas);
    if(imp.an && !imp.an.error) imp.clase = imp.an.clase;
    imp.cuenta = '';
    render();
  };
  const b = document.getElementById('i_leer'); if(b) b.onclick = leer;

    toast(n + ' documento(s) cargados con sus asientos');
  };
}

function bindFiniquito(){
  const campos = {q_nombre:'nombre', q_ini:'ini', q_fin:'fin', q_causal:'causal', q_base:'base',
    q_dias:'diasTrabajados', q_feranual:'diasFeriadoAno', q_tomados:'diasTomados', q_festivos:'festivos',
    q_afp:'afp', q_contrato:'contrato', q_afc:'afcSaldo', q_otros:'otrosDesc', q_recargo:'recargo'};
  Object.keys(campos).forEach(id=>{
    const e = document.getElementById(id); if(!e) return;
    const ev = e.tagName==='SELECT' || e.type==='date' ? 'change' : 'input';
    e.addEventListener(ev, ()=>{
      const k = campos[id];
      S.fin[k] = ['nombre','ini','fin','causal','contrato'].includes(k) ? e.value
               : k==='afp' ? parseFloat(e.value) : num(e.value);
      // al cambiar las fechas, proponer los días trabajados del mes de término
      if(k==='fin' && e.value) S.fin.diasTrabajados = Math.min(30, +e.value.slice(8,10));
      guardar();
      if(ev==='change') render(); else refrescaFin();
    });
  });
  [['q_aviso','avisoDado'],['q_ferimp','feriadoImponible']].forEach(([id,k])=>{
    const e = document.getElementById(id);
    if(e) e.addEventListener('change', ()=>{ S.fin[k] = e.checked; guardar(); render(); });
  });
}

function bindBanco(){
  const leer = ()=>{
    car.txt = document.getElementById('b_txt').value;
    if(!car.txt.trim()){ toast('Falta el archivo o el texto'); return; }
    car.filas = null;
    car.an = analizarCartola(car.txt, S.emp.ejercicio);
    render();
  };
  const b = document.getElementById('b_leer'); if(b) b.onclick = leer;
  const f = document.getElementById('b_file');
  if(f) f.onchange = async ()=>{
    const file = f.files[0]; if(!file) return;
    toast('Leyendo ' + file.name + '…');
    try{
      const r = await leerArchivoTabla(file);
      if(r.filas){
        car.filas = r.filas; car.txt = filasATexto(r.filas);
        document.getElementById('b_txt').value = car.txt.slice(0,3000);
        car.an = analizarCartola('', S.emp.ejercicio, r.filas);
        render();
      } else {
        car.filas = null;
        document.getElementById('b_txt').value = r.texto; leer();
      }
    }catch(e){ car.an = {error:e.message}; render(); }
  };
  const c = document.getElementById('b_cta');
  if(c) c.onchange = ()=>{ S.banco.cuenta = c.value; guardar(); render(); };
  const bu = document.getElementById('b_buscar');
  if(bu){
    bu.oninput = ()=>{ clearTimeout(bu._t); bu._t = setTimeout(()=>{
      S.ui.bancoFiltro = bu.value; render();
      const n = document.getElementById('b_buscar'); if(n){ n.focus(); n.selectionStart = n.value.length; }
    }, 350); };
  }
}

function det(lista, cods, invertir){
  const m = saldos(lista);
  return cods.map(c=>{
    if(!m[c]) return '';
    const v = (m[c].debe - m[c].haber) * (invertir?-1:1);
    if(R(v)===0) return '';
    return '<tr><td><span class="cod">'+c+'</span> '+esc(nomCta(c))+'</td><td class="n">'+$$(v)+'</td></tr>';
  }).join('');
}
/* ---- balance, ESF, ERI ---- */
function vBalance(){
  const todo = S.ui.balanceTodo === true;
  const corte = ymActual();
  const lista = todo ? asientosDelEjercicio() : asientosHasta(corte);
  if(!lista.length) return `
    <div class="chips noprint">
      <button class="chip" aria-pressed="${!todo}" data-bal="mes">Acumulado a ${MESES[S.ui.mes]}</button>
      <button class="chip" aria-pressed="${todo}" data-bal="todo">Ejercicio completo</button>
    </div>
    <div class="card"><h3>Sin movimientos ${todo?'en el ejercicio '+S.emp.ejercicio:'hasta '+MESES[S.ui.mes]}</h3>
    <p class="sub">El balance y los estados se arman solos apenas registres el primer documento o asiento.</p>
    <div class="row"><button class="btn" data-nuevo="venta">Registrar una venta</button><button class="btn ghost" data-ir="diario">Asiento manual</button></div></div>`;

  const b = balance8(lista), E = esf(lista), r = eri(lista);
  const util = b.util;
  const posteriores = asientosDelEjercicio().length - lista.length;

  // Controles de armado. Ojo: la columna Activo del balance de 8 columnas NO es
  // el activo del estado de situación. El balance es una hoja de trabajo y
  // ordena por naturaleza del saldo, así que los retiros del socio caen en la
  // columna Activo y la depreciación acumulada en la columna Pasivo. El estado
  // de situación los presenta donde corresponde: rebajando patrimonio y
  // rebajando el activo. Por eso se comparan los totales que sí son comparables.
  const actT = b.T.act + (util<0 ? -util : 0);
  const pasT = b.T.pas + (util>=0 ? util : 0);
  const perT = b.T.per + (util>=0 ? util : 0);
  const ganT = b.T.gan + (util<0 ? -util : 0);
  const ctrl = [
    {n:'Sumas del Debe contra sumas del Haber', a:b.T.sd, c:b.T.sh},
    {n:'Saldos deudores contra acreedores', a:b.T.deu, c:b.T.acr},
    {n:'Columnas de inventario del balance', a:actT, c:pasT},
    {n:'Columnas de resultado del balance', a:perT, c:ganT},
    {n:'Activo contra pasivo más patrimonio', a:E.activo, c:E.total},
    {n:'Resultado del ERI contra el del balance', a:r.neto, c:util}
  ];
  ctrl.forEach(x=>{ x.dif = R(x.a) - R(x.c); x.ok = Math.abs(x.dif) <= 2; });
  const sano = ctrl.every(x=>x.ok);

  // Filas de detalle de un grupo, leyendo el plan en vez de una lista fija.
  const grupo = (filtro, invertir) => {
    const m = saldos(lista);
    return Object.keys(m).sort().filter(c=>{ const t = CTA[c]; return t && filtro(t); }).map(c=>{
      const v = (m[c].debe - m[c].haber) * (invertir?-1:1);
      if(R(v)===0) return '';
      return '<tr><td><span class="cod">'+c+'</span> '+esc(nomCta(c))+'</td><td class="n">'+$$(v)+'</td></tr>';
    }).join('');
  };
  const l = (n,v) => `<tr><td>${n}</td><td class="n">${$$(v)}</td></tr>`;

  return `
  <div class="chips noprint">
    <button class="chip" aria-pressed="${!todo}" data-bal="mes">Acumulado a ${MESES[S.ui.mes]}</button>
    <button class="chip" aria-pressed="${todo}" data-bal="todo">Ejercicio completo</button>
  </div>

  <h2>Balance tributario de 8 columnas</h2>
  <div class="sub" style="margin-bottom:9px">${esc(S.emp.nombre||'')} · ejercicio ${S.emp.ejercicio} ·
    ${todo ? 'todos los asientos del año' : 'desde el 1 de enero hasta el fin de '+MESES[S.ui.mes]}
    · ${lista.length} asiento(s)</div>
  ${(!todo && posteriores) ? `<div class="note">Hay ${posteriores} asiento(s) con fecha posterior a ${MESES[S.ui.mes]} que no entran en este corte. Si comparas contra un balance hecho a otra fecha, revisa que sea el mismo período.</div>` : ''}
  ${E.fuera && E.fuera.length ? `<div class="note warn">Hay movimientos en cuentas que no están en el plan (${E.fuera.map(esc).join(', ')}). Se están mostrando como activo. Agrégalas al plan o corrige los asientos.</div>` : ''}

  <div class="tw"><table>
    <thead><tr><th>Cuenta</th><th class="n">Debe</th><th class="n">Haber</th><th class="n">Deudor</th><th class="n">Acreedor</th><th class="n">Activo</th><th class="n">Pasivo</th><th class="n">Pérdida</th><th class="n">Ganancia</th></tr></thead>
    <tbody>${b.filas.map(f=>`<tr><td><span class="cod">${f.c}</span> ${esc(f.nom)}</td>
      <td class="n">${f.sd?fmt(f.sd):''}</td><td class="n">${f.sh?fmt(f.sh):''}</td>
      <td class="n">${f.deu?fmt(f.deu):''}</td><td class="n">${f.acr?fmt(f.acr):''}</td>
      <td class="n">${f.act?fmt(f.act):''}</td><td class="n">${f.pas?fmt(f.pas):''}</td>
      <td class="n">${f.per?fmt(f.per):''}</td><td class="n">${f.gan?fmt(f.gan):''}</td></tr>`).join('')}
    </tbody>
    <tfoot>
      <tr class="tot"><td>Sumas</td><td class="n">${fmt(b.T.sd)}</td><td class="n">${fmt(b.T.sh)}</td>
        <td class="n">${fmt(b.T.deu)}</td><td class="n">${fmt(b.T.acr)}</td><td class="n">${fmt(b.T.act)}</td>
        <td class="n">${fmt(b.T.pas)}</td><td class="n">${fmt(b.T.per)}</td><td class="n">${fmt(b.T.gan)}</td></tr>
      <tr class="tot"><td>${util>=0?'Utilidad':'Pérdida'} del ejercicio</td><td colspan="4"></td>
        <td class="n">${util<0?fmt(-util):''}</td><td class="n">${util>=0?fmt(util):''}</td>
        <td class="n">${util>=0?fmt(util):''}</td><td class="n">${util<0?fmt(-util):''}</td></tr>
      <tr class="tot"><td>Totales</td><td colspan="4"></td>
        <td class="n">${fmt(b.T.act+(util<0?-util:0))}</td><td class="n">${fmt(b.T.pas+(util>=0?util:0))}</td>
        <td class="n">${fmt(b.T.per+(util>=0?util:0))}</td><td class="n">${fmt(b.T.gan+(util<0?-util:0))}</td></tr>
    </tfoot>
  </table></div>

  <div class="split2" style="margin-top:14px">
    <div class="card">
      <h3>Estado de situación financiera</h3>
      <table><tbody>
        <tr class="sec"><td colspan="2">Activo corriente</td></tr>
        ${grupo(t=>(t.tipo==='activo'||t.tipo==='activoC') && t.clase==='c')}
        <tr class="tot"><td>Total activo corriente</td><td class="n">${$$(E.ac)}</td></tr>
        <tr class="sec"><td colspan="2">Activo no corriente</td></tr>
        ${grupo(t=>(t.tipo==='activo'||t.tipo==='activoC') && t.clase==='nc')}
        <tr class="tot"><td>Total activo no corriente</td><td class="n">${$$(E.anc)}</td></tr>
        <tr class="tot"><td>Total activo</td><td class="n">${$$(E.activo)}</td></tr>
        <tr class="sec"><td colspan="2">Pasivo corriente</td></tr>
        ${grupo(t=>t.tipo==='pasivo' && t.clase==='c', true)}
        <tr class="tot"><td>Total pasivo corriente</td><td class="n">${$$(E.pc)}</td></tr>
        ${E.pnc?`<tr class="sec"><td colspan="2">Pasivo no corriente</td></tr>
        ${grupo(t=>t.tipo==='pasivo' && t.clase==='nc', true)}
        <tr class="tot"><td>Total pasivo no corriente</td><td class="n">${$$(E.pnc)}</td></tr>`:''}
        <tr class="sec"><td colspan="2">Patrimonio</td></tr>
        ${grupo(t=>t.tipo==='patrimonio', true)}
        ${grupo(t=>t.tipo==='patrimonioD', true)}
        ${l('Resultado del ejercicio', E.res)}
        <tr class="tot"><td>Total patrimonio</td><td class="n">${$$(E.patrimonio)}</td></tr>
        <tr class="tot"><td>Total pasivo y patrimonio</td><td class="n">${$$(E.total)}</td></tr>
      </tbody></table>
      ${Math.abs(E.activo-E.total)>2
        ? `<div class="note warn">Diferencia de ${$$(Math.abs(E.activo-E.total))} entre activo y pasivo más patrimonio.</div>`
        : '<div class="note ok">La ecuación patrimonial cuadra.</div>'}
    </div>

    <div class="card">
      <h3>Estado de resultados</h3>
      <table><tbody>
        <tr class="sec"><td colspan="2">Ingresos de actividades ordinarias</td></tr>
        ${grupo(t=>t.tipo==='ingreso' && t.sub!=='otros', true)}
        <tr class="sec"><td colspan="2">Costo de ventas</td></tr>
        ${grupo(t=>t.tipo==='gasto' && t.sub==='costo')}
        <tr class="tot"><td>Margen bruto</td><td class="n">${$$(r.bruto)}</td></tr>
        <tr class="sec"><td colspan="2">Gastos de administración y ventas</td></tr>
        ${grupo(t=>t.tipo==='gasto' && (t.sub==='operacional'||!t.sub))}
        ${r.otrosIng?`<tr class="sec"><td colspan="2">Otros ingresos</td></tr>
        ${grupo(t=>t.tipo==='ingreso' && t.sub==='otros', true)}`:''}
        <tr class="tot"><td>Resultado operacional</td><td class="n">${$$(r.operacional)}</td></tr>
        ${r.fin?grupo(t=>t.tipo==='gasto' && t.sub==='financiero'):l('Gastos financieros', 0)}
        <tr class="tot"><td>Resultado antes de impuesto</td><td class="n">${$$(r.antesImp)}</td></tr>
        ${r.imp?grupo(t=>t.tipo==='gasto' && t.sub==='impuesto'):l('Impuesto a la renta', 0)}
        <tr class="tot"><td>Resultado del ejercicio</td><td class="n">${$$(r.neto)}</td></tr>
      </tbody></table>
      <div class="tiny" style="margin-top:8px">Bajo NIIF para las PYMES, criterio de devengo. Los gastos se muestran por función. La tercera edición de la norma rige desde enero de 2027.</div>
    </div>
  </div>

  <div class="card">
    <h3>Control de armado</h3>
    <p class="sub">Seis igualdades que tienen que darse. Si alguna falla, hay una cuenta mal clasificada o un asiento descuadrado.</p>
    ${ctrl.map(x=>`<div class="as-l"><span>${esc(x.n)}</span>
      <em style="color:${x.ok?'var(--ink3)':'var(--bad)'}">${fmt(x.a)} · ${fmt(x.c)}${x.dif?' · dif '+fmt(x.dif):''}</em></div>`).join('')}
    ${sano ? '<div class="note ok">Todo calza.</div>'
           : '<div class="note warn">Hay una igualdad que no se cumple. Revisa si aparecen cuentas fuera del plan más arriba, o si algún asiento quedó descuadrado en el diario.</div>'}
    <details><summary>Por qué la columna Activo del balance no es el total del activo</summary>
      <div class="tiny" style="margin-top:6px">El balance de 8 columnas es una hoja de trabajo: ordena cada cuenta según si su saldo es deudor o acreedor. Por eso los Retiros del propietario caen en la columna Activo, aunque en el estado de situación rebajan el patrimonio, y la Depreciación Acumulada cae en la columna Pasivo, aunque en el estado rebaja el activo fijo. Las dos presentaciones son correctas y no tienen por qué dar el mismo número: en este ejercicio la diferencia es de ${$$(Math.abs(R(actT)-R(E.activo)))}.</div>
    </details>
  </div>`;
}

  <div class="ctrl-grid">${c.chk.map(x=>`
    <div class="ctrl ${x.nivel}">
      <div class="ctrl-h"><b>${esc(x.n)}</b>
        <span class="flag ${x.nivel==='ok'?'f-ok':x.nivel==='pendiente'?'f-warn':'f-bad'}">${x.nivel==='ok'?'cuadra':x.nivel==='pendiente'?'sin asentar':'revisar'}</span></div>
      <div class="ctrl-n">
        <div><span class="l">Tributario</span><span class="v">${$$(x.t)}</span></div>

        <div><span class="l">Diferencia</span><span class="v" style="color:${x.nivel==='error'?'var(--bad)':x.nivel==='pendiente'?'var(--warn)':'var(--ink3)'}">${x.dif?fmt(x.dif):'0'}</span></div>
      </div>
      <div class="tiny">${esc(x.ex)}</div>

  ${c.ok ? '<div class="note ok">Todo cuadra. Puedes cerrar el período con tranquilidad.</div>' : ''}
  ${c.pendientes ? `<div class="note warn">Hay ${c.pendientes} partida(s) determinada(s) en el F29 que todavía no tienen asiento. Usa las plantillas automáticas del libro diario para enterarlas: aparecen en el selector de plantillas como PPM, retención y determinación del IVA.</div>` : ''}
  ${c.errores ? `<div class="note warn">Dónde buscar una diferencia, en este orden: un asiento manual que tocó 2103 o 1106 sin documento detrás; un documento cargado con el monto bruto donde correspondía el neto; una nota de crédito registrada como documento normal; un documento con fecha fuera del mes que corresponde.</div>` : ''}
  <div class="card">
    <h3>Por qué se llevan separados</h3>
    <p class="sub">El IVA se determina sobre documentos emitidos y recibidos en el mes, sin importar si se pagaron. La contabilidad reconoce el hecho económico por devengo y además registra operaciones que no pasan por el F29: depreciación, provisiones, remuneraciones, intereses. Los dos circuitos miran lo mismo desde ángulos distintos, y por eso el punto de control no es que se parezcan mes a mes, sino que las partidas comunes calcen exactamente.</p>
  </div>`;
}

function bindPlanCuentas(){
  const t = document.getElementById('pc_tipo');
  if(t) t.onchange = ()=>{
    S.ui.ctaEdit = Object.assign({}, S.ui.ctaEdit||{}, {
      cod: val('pc_cod'), nom: val('pc_nom'), tipo: t.value, clase:'c', sub:''});
    render();
  };
}
function guardarCuenta(){
  const cod = String(val('pc_cod')).trim();
  const nom = String(val('pc_nom')).trim();
  const tipo = val('pc_tipo');
  const clase = val('pc_clase') || (['activo','activoC','pasivo'].includes(tipo) ? 'c' : '');
  const sub = val('pc_sub') || '';
  const ed = S.ui.ctaEdit || {};
  if(!/^\d{3,6}$/.test(cod)) return 'El código tiene que ser un número de 3 a 6 dígitos';
  if(nom.length < 3) return 'Ponle un nombre a la cuenta';
  if(cod !== ed.orig){
    if(CTA[cod]) return 'El código ' + cod + ' ya existe: ' + CTA[cod].nom;
  }
  S.plan = S.plan.filter(x=>x[0] !== ed.orig && x[0] !== cod);
  S.plan.push([cod, nom, tipo, clase, sub]);
  S.plan.sort((a,b)=> a[0]<b[0]?-1:1);
  S.ui.ctaEdit = null;
  reconstruirPlan(); guardar();
  return null;
}

function pintaLineas(){
  const box = document.getElementById('a_lineas'); if(!box) return;
  box.innerHTML = lineas.map((l,i)=>lineaHTML(i,l.c,l.d,l.h)).join('');
  box.querySelectorAll('[data-lin]').forEach(row=>{
    const i = +row.dataset.lin;
    row.querySelector('.l_c').addEventListener('change', e=>{ lineas[i].c=e.target.value; });
    row.querySelector('.l_d').addEventListener('input', e=>{ lineas[i].d=e.target.value; sumaLineas(); });
    row.querySelector('.l_h').addEventListener('input', e=>{ lineas[i].h=e.target.value; sumaLineas(); });
  });
  sumaLineas();
}
function sumaLineas(){
  const d = lineas.reduce((a,l)=>a+num(l.d),0), h = lineas.reduce((a,l)=>a+num(l.h),0);
  const e = document.getElementById('a_sum'); if(!e) return;
  e.innerHTML = `Debe ${fmt(d)} · Haber ${fmt(h)} · ` +
    (d===h && d>0 ? '<span class="f-ok">cuadra</span>' : d===h ? 'sin montos' : '<span class="f-bad">diferencia '+fmt(Math.abs(d-h))+'</span>');
}
function cargaPlantilla(k){
  const fechaEl = document.getElementById('a_fecha');
  const mesTxt = MESES[S.ui.mes]+' '+S.ui.ano;
  origenAsiento = (k==='__iva'||k==='__ppm'||k==='__ret') ? 'f29' : 'manual';
  if(k==='__iva' || k==='__ppm' || k==='__ret'){
    const A = f29Ano(), r = A[S.ui.mes];
    if(k==='__iva'){
      lineas = r.remanenteSig>0
        ? [{c:'2103',d:r.debito,h:''},{c:'1106',d:'',h:r.debito}]
        : [{c:'2103',d:r.debito,h:''},{c:'1106',d:'',h:r.cred+r.remanenteAnt},{c:'2105',d:'',h:r.aPagarIVA}];
      setVal('a_glosa','Determinación IVA '+mesTxt+' F29'+(r.remanenteSig?' remanente '+fmt(r.remanenteSig):''));
    }
    if(k==='__ppm'){ lineas=[{c:'1108',d:r.ppm,h:''},{c:'1102',d:'',h:r.ppm}]; setVal('a_glosa','PPM '+mesTxt+' F29'); }
    if(k==='__ret'){ lineas=[{c:'2105',d:r.ret,h:''},{c:'1102',d:'',h:r.ret}]; setVal('a_glosa','Entero retención honorarios '+mesTxt+' F29'); }
  } else if(PLANTILLAS[k]){
    const p = PLANTILLAS[k];
    lineas = p.l.map(x=>({c:x[0], d:'', h:''}));
    setVal('a_glosa', p.g.replace('{mes}', mesTxt).replace('{ano}', S.emp.ejercicio));
  } else {
    lineas = [{c:'1101',d:'',h:''},{c:'4101',d:'',h:''}];
    setVal('a_glosa','');
  }
  pintaLineas();
}
function setVal(id,v){ const e=document.getElementById(id); if(e) e.value=v; }

function bindForm(){
  const upd = ()=>{ const p = previewDoc(docClase); const e=document.getElementById('f_prev'); if(e) e.innerHTML = p.txt; };
  ['f_monto','f_modo','f_ila','f_exento','f_fecha'].forEach(id=>{ const e=document.getElementById(id); if(e){ e.addEventListener('input',upd); e.addEventListener('change',upd);} });
  upd();
  document.getElementById('f_cancel').onclick = ()=>{ docClase=null; render(); };
  document.getElementById('f_save').onclick = ()=>{
    const p = previewDoc(docClase);
    if(p.total<=0){ toast('Falta el monto'); return; }
    const d = {
      id:uid(), fecha: val('f_fecha')||hoyISO(), clase:docClase, dte: val('f_dte'),
      folio: val('f_folio'), contraparte: val('f_cp'), rut: val('f_rut'),
      neto:p.neto, exento:p.exento, iva:p.iva, ila:p.ila, retencion:p.retencion, total:p.total,
      ilaTasa: docClase==='honorario'?0:(parseFloat(val('f_ila'))||0),
      condicion: val('f_cond'), cuenta: val('f_cta'),
      creditoIva: docClase==='compra' ? !!val('f_cred') : false,
      costo: docClase==='venta' ? num(val('f_costo')) : 0,
      nc: !!val('f_nc')
    };
    if(d.dte==='61') d.nc = true;
    registrarDoc(d); guardar(); docClase=null; render(); toast('Documento y asiento registrados');
  };
}
function bindPlan(){
  const map = {p_gr:'gastosRechazados', p_inr:'ingresosNoRenta', p_ot:'otros', p_re:'reinversion', p_cr:'creditos', p_rd:'retirosDueno'};
  Object.keys(map).forEach(id=>{ const e=document.getElementById(id); if(e) e.addEventListener('change', ()=>{ S.ajustes[map[id]] = num(e.value); guardar(); render(); }); });
  const upd = ()=>{
    const i = +val('ia_tipo')||0, x = IA_LIR[i], m = num(val('ia_monto')), modo = val('ia_modo');
    const out = document.getElementById('ia_out'); if(!out) return;
    if(!m){ out.innerHTML = 'Ingresa un monto para ver la retención.'; return; }
    let bruto, imp, liq;
    if(modo==='liq'){ bruto = x.t<1 ? R(m/(1-x.t)) : m; imp = bruto-m; liq = m; }
    else { bruto = m; imp = R(m*x.t); liq = m-imp; }
    out.innerHTML = `Base ${$$(bruto)} · impuesto adicional ${pct(x.t)} = <b>${$$(imp)}</b> · se remesan ${$$(liq)}.
      <div class="tiny" style="margin-top:5px">${esc(x.ref)}. La retención se declara en el F50 dentro del mes siguiente. Si hay convenio para evitar la doble tributación con el país del beneficiario, la tasa puede ser menor: revisa el convenio antes de retener.</div>`;
  };
  ['ia_tipo','ia_monto','ia_modo'].forEach(id=>{ const e=document.getElementById(id); if(e){ e.addEventListener('input',upd); e.addEventListener('change',upd);} });
  upd();
}

/* ---- eventos globales ---- */
document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.v){ S.ui.vista=t.dataset.v; docClase=null; guardar(); render(); return; }
  if(t.dataset.ir){ S.ui.vista=t.dataset.ir; guardar(); render(); return; }
  if(t.dataset.nuevo){ docClase=t.dataset.nuevo; S.ui.vista='docs'; render(); return; }
  if(t.dataset.fil){ S.ui.filtroDoc=t.dataset.fil; render(); return; }
  if(t.dataset.rm){ S.ui.remunModo=t.dataset.rm; guardar(); render(); return; }
  if(t.dataset.rev){ S.ui.revisorModo=t.dataset.rev; guardar(); render(); return; }
  if(t.dataset.bal){ S.ui.balanceTodo = t.dataset.bal==='todo'; guardar(); render(); return; }
  if(t.dataset.deldoc){ if(confirm('¿Borrar el documento y su asiento?')){ borrarDoc(t.dataset.deldoc); guardar(); render(); } return; }
  if(t.dataset.dela){ if(confirm('¿Borrar este asiento?')){ borrarAsiento(t.dataset.dela); guardar(); render(); } return; }
  if(t.dataset.pl){ S.ui.vista='diario'; render(); setVal('a_pl', t.dataset.pl); cargaPlantilla(t.dataset.pl); return; }

  if(t.id==='b_ok'){
    S.banco.movs = (S.banco.movs||[]).concat(car.an.movs).sort((a,b)=> a.fecha<b.fecha?-1:1);
    const n = car.an.movs.length; car = {txt:'', an:null, filas:null};
    guardar(); render(); toast(n+' movimiento(s) cargados');
    return;
  }
  if(t.id==='b_borrar'){
    if(confirm('¿Borrar los movimientos de la cartola? Los asientos que ya grabaste se mantienen.')){
      S.banco.movs = []; car = {txt:'', an:null}; guardar(); render(); toast('Cartola borrada');
    }
    return;
  }
  if(t.dataset.conc || t.id==='b_conc_todo'){
    const E = emparejar();
    const objetivo = t.id==='b_conc_todo'
      ? E.soloBanco.filter(m=>m.sug && m.sug.punt>150)
      : E.soloBanco.filter(m=>m.id===t.dataset.conc && m.sug);
    let n = 0;
    objetivo.forEach(m=>{
      const a = asientoDesdeDocBanco(m, m.sug.d);
      const as = addAsiento(m.fecha, a.g, a.l, 'banco');
      const real = S.banco.movs.find(x=>x.id===m.id);
      if(as && real){ real.aid = as.id; real.docId = m.sug.d.id; n++; }
    });
    guardar(); render(); toast(n+' movimiento(s) conciliados con su asiento');
    return;
  }
  if(t.dataset.reg || t.id==='b_reg_lote'){
    const ids = t.id==='b_reg_lote'
      ? Array.from(document.querySelectorAll('.b_sel')).filter(x=>x.checked).map(x=>x.dataset.sel)
      : [t.dataset.reg];
    if(!ids.length){ toast('No marcaste ninguno'); return; }
    let n = 0;
    ids.forEach(id=>{
      const m = S.banco.movs.find(x=>x.id===id); if(!m || m.aid) return;
      const sel = document.querySelector('[data-cta="'+id+'"]');
      const cuenta = sel ? sel.value : cuentaSugerida(m)[0];
      const a = asientoDesdeMovBanco(m, cuenta);
      const as = addAsiento(m.fecha, a.g, a.l, 'banco');
      if(as){ m.aid = as.id; n++;
        S.banco.reglas = S.banco.reglas || {};
        S.banco.reglas[claveGlosa(m.glosa)] = cuenta;   // aprende para la próxima
      }
    });
    guardar(); render();
    toast(n===1 ? 'Asiento grabado y movimiento conciliado' : n+' movimientos registrados');
    return;
  }
  if(t.id==='b_todos' || t.id==='b_ninguno'){
    document.querySelectorAll('.b_sel').forEach(x=>{ x.checked = t.id==='b_todos'; });
    return;
  }
  if(t.id==='d_importar'){ docClase='import'; imp={txt:'',an:null,clase:'',cuenta:'',credito:true,filas:null}; render(); return; }
  if(t.id==='q_grabar'){
    const q = finiquito(S.fin);
    if(q.haberes<=0){ toast('Falta la remuneración o las fechas'); return; }
    const A = asientosFiniquito(S.fin, q);
    let n=0;
    A.forEach(a=>{
      const d=a.l.reduce((x,l)=>x+(l.d||0),0), h=a.l.reduce((x,l)=>x+(l.h||0),0);
      if(R(d)!==R(h)) return;
      addAsiento(S.fin.fin, a.g, a.l.map(l=>({c:l.c,d:l.d||0,h:l.h||0})), 'remun'); n++;
    });
    guardar(); render();
    toast(n===A.length ? n+' asientos grabados' : 'Grabados '+n+' de '+A.length+': uno no cuadraba');
    return;
  }
  if(t.id==='r_grabar'){
    const fecha = S.ui.ano+'-'+String(S.ui.mes+1).padStart(2,'0')+'-30';
    const q = liquidacion(S.remun, fecha);
    if(q.imponible<=0){ toast('Falta el sueldo base'); return; }
    const A = asientosRemuneracion(S.remun, fecha, q);
    let mal = 0;
    A.forEach(a=>{
      const d=a.l.reduce((x,l)=>x+(l.d||0),0), h=a.l.reduce((x,l)=>x+(l.h||0),0);
      if(R(d)!==R(h)){ mal++; return; }
      addAsiento(fecha, a.g, a.l.map(l=>({c:l.c,d:l.d||0,h:l.h||0})), 'remun');
    });
    guardar(); render();
    toast(mal ? 'Se grabaron '+(A.length-mal)+' de '+A.length+': uno no cuadraba'
              : A.length+' asientos grabados en el diario');
    return;
  }
  if(t.id==='pc_guardar'){
    const err = guardarCuenta();
    if(err){ toast(err); return; }
    render(); toast('Plan de cuentas actualizado'); return;
  }
  if(t.id==='pc_cancelar'){ S.ui.ctaEdit = null; render(); return; }
  if(t.dataset.ctaed){
    const c = CTA[t.dataset.ctaed];
    S.ui.ctaEdit = {orig:c.cod, cod:c.cod, nom:c.nom, tipo:c.tipo, clase:c.clase, sub:c.sub};
    render(); return;
  }
  if(t.dataset.ctadel){
    const cod = t.dataset.ctadel;
    if(cuentaEnUso(cod)){ toast('Esa cuenta tiene movimientos: no se puede borrar'); return; }
    if(confirm('¿Borrar la cuenta '+cod+' '+CTA[cod].nom+'?')){
      S.plan = S.plan.filter(x=>x[0]!==cod); S.ui.ctaEdit = null;
      reconstruirPlan(); guardar(); render(); toast('Cuenta borrada');
    }
    return;
  }
  if(t.id==='p_sync'){ t.disabled=true; t.textContent='Actualizando…'; sincronizar().then(()=>render()); return; }
  if(t.id==='p_reset'){ if(confirm('¿Volver a los valores que trae la app?')){ S.par.manual=null; guardar(); render(); toast('Parámetros restaurados'); } return; }
  if(t.id==='a_add'){ lineas.push({c:'1101',d:'',h:''}); pintaLineas(); return; }
  if(t.id==='a_save'){
    const d = lineas.reduce((a,l)=>a+num(l.d),0), h = lineas.reduce((a,l)=>a+num(l.h),0);
    if(d===0 && h===0){ toast('El asiento no tiene montos'); return; }
    if(R(d)!==R(h)){ toast('No cuadra: diferencia de '+fmt(Math.abs(d-h))); return; }
    addAsiento(val('a_fecha')||hoyISO(), val('a_glosa')||'Asiento manual', lineas.map(l=>({c:l.c,d:l.d,h:l.h})), origenAsiento);
    lineas=[{c:'1101',d:'',h:''},{c:'4101',d:'',h:''}]; origenAsiento='manual'; guardar(); render(); toast('Asiento grabado'); return;
  }
  if(t.id==='c_save'){
    S.emp.nombre=val('c_nom'); S.emp.rut=val('c_rut'); S.emp.regimen=val('c_reg');
    S.emp.ejercicio=parseInt(val('c_ej'))||S.emp.ejercicio;
    S.emp.sobre50kUF=!!val('c_50'); S.emp.inventarioPermanente=!!val('c_inv');
    S.emp.ppmManual=val('c_ppm'); S.par.remanenteInicial=num(val('c_rem'));
    S.ui.ano=S.emp.ejercicio; guardar(); render(); toast('Guardado'); return;
  }
  if(t.id==='x_json'){ bajar('cuadratura-'+S.emp.ejercicio+'.json', JSON.stringify(S,null,1), 'application/json'); return; }
  if(t.id==='x_csv'){
    const f = ['Asiento;Fecha;Codigo;Cuenta;Glosa;Debe;Haber'];
    asientosDelEjercicio().forEach(a=>a.lineas.forEach(l=>
      f.push([a.n,a.fecha,l.c,nomCta(l.c),(a.glosa||'').replace(/;/g,','),l.d||0,l.h||0].join(';'))));
    bajar('libro-diario-'+S.emp.ejercicio+'.csv', '\ufeff'+f.join('\n'), 'text/csv'); return;
  }
  if(t.id==='x_imp'){ document.getElementById('x_file').click(); return; }
  if(t.id==='x_del'){
    if(confirm('Se borran documentos, asientos y configuración. ¿Seguro?')){ S=estadoInicial(); guardar(); render(); toast('Datos borrados'); }
    return;
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='a_pl'){ cargaPlantilla(e.target.value); }
  if(e.target.id==='m_cta'){ S.ui.ctaMayor=e.target.value; guardar(); render(); }
  if(e.target.id==='x_file'){
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ try{ const o=JSON.parse(r.result); if(!o.docs||!o.asientos) throw 0;
        S=migrar(o); reconstruirPlan(); guardar(); render(); toast('Respaldo cargado'); }
      catch(err){ toast('El archivo no es un respaldo válido'); } };
    r.readAsText(f);
  }
});
function bajar(nombre, txt, mime){
  const b = new Blob([txt],{type:mime+';charset=utf-8'}), u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href=u; a.download=nombre; a.click();
  setTimeout(()=>URL.revokeObjectURL(u), 1500);
}

/* ---- teclado: pensado para capturar rápido con el teclado en el PC ---- */
const esEscritorio = () => window.matchMedia('(min-width:900px)').matches;
document.addEventListener('keydown', e=>{
  const meta = e.ctrlKey || e.metaKey;

  // Alt + 1..9 cambia de pestaña
  if(e.altKey && !meta && e.key>='1' && e.key<='9'){
    const v = VISTAS[+e.key-1];
    if(v){ e.preventDefault(); S.ui.vista=v[0]; docClase=null; guardar(); render(); }
    return;
  }
  // Ctrl/Cmd + Enter graba lo que esté abierto
  if(meta && e.key==='Enter'){
    const b = document.getElementById('f_save') || document.getElementById('a_save') || document.getElementById('c_save');
    if(b){ e.preventDefault(); b.click(); }
    return;
  }
  // Esc cierra el formulario de documento
  if(e.key==='Escape' && docClase){ e.preventDefault(); docClase=null; render(); return; }
  // Enter dentro de un monto del asiento agrega otra línea
  if(e.key==='Enter' && !meta && e.target && (e.target.classList.contains('l_d')||e.target.classList.contains('l_h'))){
    e.preventDefault();
    const d = lineas.reduce((a,l)=>a+num(l.d),0), h = lineas.reduce((a,l)=>a+num(l.h),0);
    if(R(d)===R(h) && d>0){ document.getElementById('a_save').click(); return; }
    lineas.push({c:'1101',d:'',h:''}); pintaLineas();
    const c = document.querySelectorAll('#a_lineas .l_c'); if(c.length) c[c.length-1].focus();
  }
});
function foco(id){ if(!esEscritorio()) return; const e=document.getElementById(id); if(e) e.focus(); }

/* ---- funciona instalada cuando está publicada en un servidor ---- */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---- arranque ---- */
(async function init(){
  const g = await Store.get();
  if(g) S = migrar(g);
  reconstruirPlan();
  const sm = document.getElementById('selMes'), sa = document.getElementById('selAno');
  sm.innerHTML = MESES.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
  const y0 = S.emp.ejercicio;
  sa.innerHTML = [y0-2,y0-1,y0,y0+1].map(y=>`<option value="${y}">${y}</option>`).join('');
  sm.value = S.ui.mes; sa.value = S.ui.ano;
  if(S.par.autoSync !== false && (!S.par.indSync || diasDesde(S.par.indSync) >= 1)){
    sincronizar(true).then(()=>{ if(S.ui.vista==='config'||S.ui.vista==='panel') render(); });
  }
  sm.onchange = ()=>{ S.ui.mes=+sm.value; guardar(); render(); };
  sa.onchange = ()=>{ S.ui.ano=+sa.value; S.emp.ejercicio=+sa.value; guardar(); render(); };
  render();
})();
</script>
