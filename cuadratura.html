<style>
:root{
  --paper:#F7F6F1; --bar:#E6EDE4; --ink:#16211C; --ink2:#55625B; --ink3:#8A958E;
  --rule:#CBD1C8; --field:#fff; --debe:#1F4E79; --haber:#9A3324;
  --ok:#0F5E4A; --warn:#A8641B; --bad:#9A3324;
  --sp:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 2px}
h3{font-size:15px;margin:0 0 6px}
p{margin:0 0 8px}
a{color:var(--ok)}
.wrap{max-width:960px;margin:0 auto;padding:0 var(--sp)}

/* ---------- cabecera ---------- */
header{background:var(--ink);color:#EDF1EC;padding:10px 0 0;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.brand b{font-size:17px;font-weight:600;letter-spacing:.01em}
.brand span{font-size:12px;color:#9FB0A6}
.periodo{display:flex;gap:6px;align-items:center;margin:7px 0 8px}
@media(max-width:400px){.brand span{display:none}}
.periodo select{width:auto;min-width:112px;background:#26332C;color:#EDF1EC;border:1px solid #3B4A42;border-radius:6px;padding:5px 8px;font-size:14px;font-family:inherit}
.periodo .emp{font-size:12px;color:#9FB0A6;margin-left:auto;text-align:right;line-height:1.3;min-width:0}
.periodo .emp b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:430px){.periodo .emp i{display:none}}
nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-top:1px solid #2C3A33}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:0;border-bottom:3px solid transparent;color:#9FB0A6;
  padding:10px 12px;font-size:13.5px;white-space:nowrap;font-family:inherit;cursor:pointer
}
nav button[aria-current="true"]{color:#fff;border-bottom-color:#7FB79F}
main{padding:16px 0 64px}

/* ---------- piezas ---------- */
.card{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:13px;margin-bottom:12px}
.card.plain{background:transparent;border:0;padding:0}
.sub{color:var(--ink2);font-size:13px}
.tiny{font-size:12px;color:var(--ink3);line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
label{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
input,select,textarea{
  width:100%;background:var(--field);border:1px solid var(--rule);border-radius:6px;
  padding:8px 9px;font-size:15px;font-family:inherit;color:var(--ink);font-variant-numeric:tabular-nums
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ok);outline-offset:1px}
input[type=number]{text-align:right}
button.btn{
  background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:6px;
  padding:9px 14px;font-size:14px;font-family:inherit;cursor:pointer
}
button.btn.ghost{background:#fff;color:var(--ink)}
button.btn.sm{padding:5px 9px;font-size:13px}
button.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
button.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:#fff;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- tablas tipo libro ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{
  text-align:left;font-weight:600;font-size:11.5px;color:var(--ink2);
  padding:7px 9px;border-bottom:1px solid var(--rule);background:#fff;position:sticky;top:0;white-space:nowrap
}
td{padding:6px 9px;border-bottom:1px solid #EBEEE9;vertical-align:top}
tbody tr:nth-child(even){background:var(--bar)}
tr.tot td{font-weight:600;border-top:2px solid var(--ink);background:#fff}
tr.sec td{background:#F0F2EE;font-weight:600;font-size:12px;color:var(--ink2)}
.n{text-align:right;white-space:nowrap}
.cod{color:var(--ink2);font-size:12.5px;white-space:nowrap}
.d{color:var(--debe)} .h{color:var(--haber)}
.z{color:#C3C9C1}
@media(max-width:620px){.op{display:none} td,th{padding:6px 7px}}

/* ---------- la balanza (pieza central) ---------- */
.balanza{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff;margin-bottom:12px}
.balanza .b-top{display:grid;grid-template-columns:1fr 1fr}
.balanza .b-col{padding:13px}
.balanza .b-col:first-child{border-right:1px solid var(--rule)}
.balanza .b-lab{font-size:11.5px;color:var(--ink2);margin-bottom:3px}
.balanza .b-val{font-size:21px;font-weight:600;letter-spacing:-.02em}
.seam{height:6px;display:flex}
.seam i{flex:1;display:block}
.seam.ok i{background:var(--ok)}
.seam.bad i:first-child{background:var(--bad)}
.seam.bad i:last-child{background:var(--warn)}
.b-foot{padding:10px 13px;font-size:13.5px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.b-foot.ok{color:var(--ok)} .b-foot.bad{color:var(--bad)} .b-foot.pend{color:var(--warn)}
.seam.pend i{background:var(--warn)}

.dash{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:620px){.dash{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.dash{grid-template-columns:1fr 1fr 1fr}}
.dash-c{border:1px solid var(--rule);border-left-width:4px;border-radius:8px;padding:10px 11px;background:#fff}
.dash-c.ok{border-left-color:var(--ok)} .dash-c.warn{border-left-color:var(--warn)}
.dash-c.bad{border-left-color:var(--bad)} .dash-c.mute{border-left-color:var(--rule)}
.dash-k{font-size:11.5px;color:var(--ink2)}
.dash-v{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:1px 0 4px}
.dash-l{font-size:12.5px;color:var(--ink2);line-height:1.4}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:10px 11px}
.kpi .l{font-size:11.5px;color:var(--ink2)}
.kpi .v{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.kpi .s{font-size:11.5px;color:var(--ink3)}

.flag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.f-ok{color:var(--ok)} .f-warn{color:var(--warn)} .f-bad{color:var(--bad)} .f-mute{color:var(--ink3)}

.ctrl{background:#fff;border:1px solid var(--rule);border-left-width:4px;border-radius:8px;padding:11px 12px;margin-bottom:8px}
.ctrl.ok{border-left-color:var(--ok)} .ctrl.pendiente{border-left-color:var(--warn)} .ctrl.error{border-left-color:var(--bad)}
.ctrl-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.ctrl-n{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:7px}
.ctrl-n .l{display:block;font-size:11px;color:var(--ink2)}
.ctrl-n .v{display:block;font-size:14.5px;font-weight:600}
.ctrl-n div:nth-child(2),.ctrl-n div:nth-child(3){text-align:right}
.as{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:10px 11px;margin-bottom:8px}
.as-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.as-h b{color:var(--ink);font-size:14px}
.as-h .x{margin-left:auto}
.as-g{font-size:13.5px;margin:1px 0 6px}
.as-l{display:flex;gap:12px;justify-content:space-between;border-top:1px solid #EEF1EC;padding:4px 0;font-size:13.5px}
.as-l:first-of-type{border-top:0}
.as-l em{font-style:normal;white-space:nowrap;font-weight:600}
.as-l .s{font-weight:400;color:var(--ink3);font-size:12px}
.lista{list-style:none;padding:0;margin:0}
.lista li{border-bottom:1px solid #EBEEE9;padding:9px 0;display:flex;gap:10px;align-items:flex-start}
.lista li:last-child{border-bottom:0}
.lista .g{flex:1;min-width:0}
.lista .t{font-size:14px}
.lista .m{font-size:12px;color:var(--ink2)}

.note{border-left:3px solid var(--rule);padding:2px 0 2px 10px;font-size:12.5px;color:var(--ink2);margin:8px 0}
.note.ok{border-color:var(--ok)} .note.warn{border-color:var(--warn)}
details{border-top:1px solid var(--rule);padding-top:9px;margin-top:9px}
summary{cursor:pointer;font-size:13.5px;color:var(--ink2)}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;
  padding:9px 15px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:60
}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- escritorio ---------- */
.split,.split2{display:block}
.hint{display:none;font-size:12px;color:var(--ink3);margin-top:7px}
@media(min-width:900px){
  body{font-size:15.5px}
  .wrap{max-width:1180px;padding:0 22px}
  nav button{padding:11px 15px;font-size:14px}
  main{padding:20px 0 70px}
  .split{display:grid;grid-template-columns:390px minmax(0,1fr);gap:18px;align-items:start}
  .split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .sticky-col{position:sticky;top:126px}
  .ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ctrl-grid .ctrl{margin-bottom:0}
  .kpi .v{font-size:20px}
  .as-l{font-size:14px}
  .hint{display:block}
}
kbd{font:inherit;font-size:11px;background:#EEF1EC;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 4px}
@media(min-width:1280px){ .wrap{max-width:1280px} .split{grid-template-columns:420px minmax(0,1fr)} }
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff}.card,.tw{break-inside:avoid;border-color:#999}
}
</style>

<main><div class="wrap" id="app"></div></main>

<script>
"use strict";
/* ======================================================================
   CUADRATURA — herramienta de trabajo diario para contadores en Chile
   Circuito tributario  : documentos -> F29 -> proyección F22 / planificación
   Circuito contable    : asientos  -> mayor -> balance 8 col -> ESF / ERI
   Puente               : pestaña Cuadratura
   ====================================================================== */

/* ---------------------- 1. parámetros de la ley ----------------------- */
const IVA = 0.19;

// Retención de boletas de honorarios (Ley 21.133, alza gradual al 17% en 2028)
const RET_HON = {2020:.1075,2021:.115,2022:.1225,2023:.13,2024:.1375,2025:.145,2026:.1525,2027:.16,2028:.17};

// Impuesto de Primera Categoría por régimen y año comercial (Ley 21.755)
const IDPC = {
  '14D3':{2023:.10,2024:.125,2025:.125,2026:.125,2027:.125,2028:.15,2029:.25},
  '14D8':{2023:0,2024:0,2025:0,2026:0,2027:0,2028:0,2029:0},
  '14A' :{2023:.27,2024:.27,2025:.27,2026:.27,2027:.27,2028:.27,2029:.27}
};
const REG_CORTO = {'14D3':'Pro Pyme General','14D8':'Pro Pyme Transparente','14A':'Semi Integrado'};
const REG_ART = {'14D3':'Art. 14 D N°3','14D8':'Art. 14 D N°8','14A':'Art. 14 A'};
const REGIMENES = {
  '14D3':'Pro Pyme General (Art. 14 D N°3)',
  '14D8':'Pro Pyme Transparente (Art. 14 D N°8)',
  '14A' :'Semi Integrado / General (Art. 14 A)'
};
// PPM obligatorio. Pro Pyme General va a la mitad por la Ley 21.755 (2025-2027).
function tasaPPM(reg, ano, sobre50kUF){
  if(reg==='14D8') return .002;
  if(reg==='14A')  return null;            // tasa variable, la fija el F22 anterior
  const base = sobre50kUF ? .005 : .0025;
  return (ano>=2025 && ano<=2027) ? base/2 : base;
}

// Impuestos adicionales del DL 825 (se aplican sobre la misma base del IVA)
const DL825 = [
  {t:0,     n:'Sin impuesto adicional'},
  {t:.10,   n:'Bebidas analcohólicas, energizantes, jarabes, aguas con aditivos — 10% (Art. 42 a)'},
  {t:.18,   n:'Las mismas con alto contenido de azúcares, ≥15 g/240 ml — 18% (Art. 42 a)'},
  {t:.205,  n:'Vinos, cervezas, chichas, sidras y demás bebidas alcohólicas — 20,5% (Art. 42 b)'},
  {t:.315,  n:'Licores, piscos, whisky, aguardientes y destilados — 31,5% (Art. 42 c)'},
  {t:.15,   n:'Artículos suntuarios: joyas, piedras preciosas, pieles finas, caviar — 15% (Art. 37)'},
  {t:.50,   n:'Artículos de pirotecnia — 50% (Art. 37 j)'}
];

// Impuesto Adicional de la Ley de la Renta (remesas al exterior)
const IA_LIR = [
  {t:.35, n:'Retiros, remesas o dividendos al exterior', ref:'Art. 58 N°1 y 2 / 14', cred:true},
  {t:.30, n:'Regalías por marcas, patentes y fórmulas', ref:'Art. 59 inc. 1'},
  {t:.15, n:'Programas computacionales no estándar y derechos de autor', ref:'Art. 59 inc. 1'},
  {t:0,   n:'Programas computacionales estándar (exentos)', ref:'Art. 59 inc. 1'},
  {t:.15, n:'Trabajos de ingeniería y asesorías técnicas', ref:'Art. 59 N°2 — 20% si el beneficiario está en régimen fiscal preferencial (Art. 41 H)'},
  {t:.04, n:'Intereses a bancos o instituciones financieras extranjeras', ref:'Art. 59 N°1 letra b — requisitos copulativos'},
  {t:.35, n:'Intereses, regla general', ref:'Art. 59 inc. 4'},
  {t:.22, n:'Primas de seguro contratadas en el exterior', ref:'Art. 59 N°3'},
  {t:.02, n:'Primas de reaseguro', ref:'Art. 59 N°3'},
  {t:.05, n:'Fletes marítimos y comisiones de embarque', ref:'Art. 59 N°4'},
  {t:.20, n:'Arrendamiento o fletamento de naves extranjeras', ref:'Art. 59 N°5'},
  {t:.35, n:'Otras rentas de fuente chilena', ref:'Art. 60'}
];

// Tramos del Global Complementario, expresados en UTA (verificar tabla del año en el SII)
const TRAMOS_IGC = [
  {h:13.5, t:0,    r:0},     {h:30,  t:.04,  r:.54},
  {h:50,   t:.08,  r:1.74},  {h:70,  t:.135, r:4.49},
  {h:90,   t:.23,  r:11.14}, {h:120, t:.304, r:17.80},
  {h:310,  t:.35,  r:23.32}, {h:1e9, t:.40,  r:38.82}
];


/* ======================================================================
   PARÁMETROS CON VIGENCIA
   Cada valor sabe desde cuándo rige. La app elige el que corresponde al
   período que estás trabajando, no el de hoy: si en octubre corriges una
   remuneración de marzo, usa las tasas de marzo.
   Verificado el 12-09-2026 contra Superintendencia de Pensiones, Previred,
   Dirección del Trabajo y SII.
   ====================================================================== */
const PARAM = {
  verificado: '2026-09-12',

  /* ---- remuneraciones y leyes sociales ---- */
  imm: [   // ingreso mínimo mensual
    {desde:'2025-05-01', gen:529000, menor:394622, noRem:340574, ley:'Ley 21.751'},
    {desde:'2026-01-01', gen:539000, menor:402082, noRem:347434, ley:'Ley 21.751'},
    {desde:'2026-05-01', gen:553553, menor:412938, noRem:356815, ley:'Ley 21.830'}
  ],
  topes: [ // en UF, los reajusta la Superintendencia de Pensiones cada enero
    {desde:'2025-01-01', afp:87.8, afc:131.9, ips:60, apvMes:50, apvAno:600},
    {desde:'2026-01-01', afp:89.9, afc:135.1, ips:60, apvMes:50, apvAno:600},
    {desde:'2026-02-01', afp:90.0, afc:135.2, ips:60, apvMes:50, apvAno:600}
  ],
  afp: [   // cotización total de cargo del trabajador: 10% + comisión
    {n:'Modelo',    t:0.1058}, {n:'Uno',      t:0.1046}, {n:'PlanVital', t:0.1116},
    {n:'Habitat',   t:0.1127}, {n:'Capital',  t:0.1144}, {n:'Cuprum',    t:0.1144},
    {n:'ProVida',   t:0.1145}, {n:'IPS (ex INP)', t:0.1855}
  ],
  salud: 0.07,
  afc: {indefTrab:0.006, indefEmp:0.024, plazoEmp:0.030},
  aporteEmpleador: [  // Ley 21.735, artículo cuarto transitorio
    {desde:'2025-08-01', t:0.01,   sisAparte:true },
    {desde:'2026-08-01', t:0.035,  sisAparte:false},
    {desde:'2027-08-01', t:0.0425, sisAparte:false},
    {desde:'2028-08-01', t:0.05,   sisAparte:false},
    {desde:'2029-08-01', t:0.057,  sisAparte:false},
    {desde:'2030-08-01', t:0.064,  sisAparte:false},
    {desde:'2031-08-01', t:0.071,  sisAparte:false},
    {desde:'2032-08-01', t:0.078,  sisAparte:false},
    {desde:'2033-08-01', t:0.085,  sisAparte:false}
  ],
  sis: [   // solo se cobra aparte hasta julio de 2026; después va dentro del aporte
    {desde:'2025-01-01', t:0.0149}, {desde:'2026-01-01', t:0.0154},
    {desde:'2026-04-01', t:0.0162}, {desde:'2026-07-01', t:0.0200}
  ],
  mutual: 0.0093,   // 0,90% básica + adicional por riesgo: usa la de tu certificado
  gratifTopeIMM: 4.75,
  asigFam: [
    {desde:'2025-05-01', tramos:[{h:620251,m:21607},{h:905941,m:13260},{h:1412957,m:4188},{h:1e12,m:0}]},
    {desde:'2026-05-01', tramos:[{h:649039,m:22601},{h:947990,m:13870},{h:1478539,m:4382},{h:1e12,m:0}]}
  ],
  // Impuesto Único de Segunda Categoría, tramos mensuales en UTM
  iusc: [{h:13.5,t:0,r:0},{h:30,t:.04,r:.54},{h:50,t:.08,r:1.74},{h:70,t:.135,r:4.49},
         {h:90,t:.23,r:11.14},{h:120,t:.304,r:17.80},{h:310,t:.35,r:23.32},{h:1e9,t:.40,r:38.82}],

  /* ---- tributario ---- */

// Devuelve el tramo vigente a una fecha dada (el último cuyo "desde" ya pasó).
function vigenteA(arr, fecha){
  let r = arr[0];
  for(const x of arr){ if(x.desde <= fecha) r = x; else break; }
  return r;
}

}

  const P = PA();

    topes: vigenteA(P.topes, fecha),

let FUENTE_IND = 'https://mindicador.cl/api';
async function sincronizar(silencioso){
  const out = {ok:[], falla:[]};
  // 1. UF, UTM, IPC y dólar desde mindicador.cl (API pública, sin clave)
  try{
    const r = await fetch(FUENTE_IND, {cache:'no-store'});

      S.par.uf = j.uf.valor; S.par.utm = j.utm.valor;
      S.par.ipc = j.ipc ? j.ipc.valor : null;

      out.ok.push('UF ' + fmt(j.uf.valor) + ' y UTM ' + fmt(j.utm.valor));
    } else out.falla.push('la respuesta de indicadores vino incompleta');
  }catch(e){ out.falla.push('no se pudo conectar a mindicador.cl'); }

  // 2. Tabla de parámetros. Si no configuraste una dirección, se busca sola
  //    junto a la app: publicar la carpeta alcanza, no hay que ajustar nada.
  const auto = location.protocol.indexOf('http')===0;
  const url = (S.par.remoto && S.par.remoto.url) || (auto ? 'parametros.json' : '');
  if(url){
    try{

      const j = await r.json();
      if(j && (j.topes || j.imm || j.retHon)){
        S.par.remoto = S.par.remoto || {};

      } else if(S.par.remoto && S.par.remoto.url) out.falla.push('el archivo de parámetros no tiene el formato esperado');
    }catch(e){ if(S.par.remoto && S.par.remoto.url) out.falla.push('no se pudo leer la tabla de parámetros'); }
  }
  S.par.ultimoIntento = hoyISO();
  guardar();
  if(!silencioso) toast(out.ok.length ? 'Actualizado: '+out.ok.join(' · ') : out.falla[0]||'Sin cambios');

const R = Math.round;

function num(v){
  if(typeof v === 'number') return isNaN(v)?0:v;
  let t = String(v==null?'':v).trim().replace(/\s|\$/g,'');
  if(!t) return 0;
  if(t.indexOf(',')>=0)                       t = t.replace(/\./g,'').replace(',','.');  // 1.234,56
  else if(/^-?\d{1,3}(\.\d{3}){2,}$/.test(t)) t = t.replace(/\./g,'');                    // 1.234.567
  const n = parseFloat(t);                                                                // 0.315 queda intacto
  return isNaN(n)?0:n;
}

// descomposición de montos con IVA e impuesto adicional del DL 825
function descomponer(monto, modo, tIla){
  monto = R(num(monto)); tIla = tIla||0;
  if(monto<=0) return {neto:0,iva:0,ila:0,total:0};
  if(modo==='bruto'){
    const neto = R(monto/(1+IVA+tIla));
    const iva  = R(neto*IVA);
    const ila  = monto - neto - iva;
    return {neto, iva, ila: tIla?ila:0, total: monto - (tIla?0:ila)};
  }
  const iva = R(monto*IVA), ila = R(monto*tIla);
  return {neto:monto, iva, ila, total:monto+iva+ila};
}

function balance8(lista){
  const m = saldos(lista), filas=[];
  let T={sd:0,sh:0,deu:0,acr:0,act:0,pas:0,per:0,gan:0};
  Object.keys(m).sort().forEach(c=>{
    const x=m[c], k=CTA[c]?CTA[c].tipo:'activo';
    const deu=Math.max(x.debe-x.haber,0), acr=Math.max(x.haber-x.debe,0);
    const f={c, nom:nomCta(c), sd:x.debe, sh:x.haber, deu, acr, act:0,pas:0,per:0,gan:0};
    if(k==='ingreso'||k==='gasto'){ f.per=deu; f.gan=acr; } else { f.act=deu; f.pas=acr; }
    filas.push(f);
    T.sd+=f.sd;T.sh+=f.sh;T.deu+=f.deu;T.acr+=f.acr;T.act+=f.act;T.pas+=f.pas;T.per+=f.per;T.gan+=f.gan;
  });
  const util = T.gan - T.per;                       // + utilidad, − pérdida
  return {filas, T, util};
}
// El estado de resultados y el de situación financiera se arman recorriendo
// TODAS las cuentas con movimiento y preguntándole al plan a qué grupo va cada
// una. Antes iban contra una lista de códigos escrita a mano, y cualquier
// cuenta fuera de esa lista desaparecía del estado sin avisar.
function clasificar(lista){
  const m = saldos(lista), fuera = [];
  const deu = c => m[c].debe - m[c].haber;      // saldo deudor, negativo si es acreedor
  const G = {ordinario:0, otrosIng:0, costo:0, oper:0, fin:0, imp:0,
             ac:0, anc:0, pc:0, pnc:0, cap:0, uac:0, ret:0};
  Object.keys(m).forEach(c=>{
    const t = CTA[c], v = deu(c);
    if(!t){ G.ac += v; fuera.push(c); return; }   // cuenta desconocida: se trata como activo y se avisa
    switch(t.tipo){
      case 'activo': case 'activoC':
        if(t.clase==='nc') G.anc += v; else G.ac += v; break;
      case 'pasivo':
        if(t.clase==='nc') G.pnc -= v; else G.pc -= v; break;
      case 'patrimonio':
        if(t.sub==='acumuladas') G.uac -= v; else G.cap -= v; break;
      case 'patrimonioD':
        G.ret += v; break;
      case 'ingreso':
        if(t.sub==='otros') G.otrosIng -= v; else G.ordinario -= v; break;
      case 'gasto':
        if(t.sub==='costo') G.costo += v;
        else if(t.sub==='financiero') G.fin += v;
        else if(t.sub==='impuesto') G.imp += v;
        else G.oper += v;
        break;
      default: G.ac += v; fuera.push(c);
    }
  });
  return {G, fuera, m};
}
function eri(lista){
  const {G, fuera} = clasificar(lista);
  const bruto = G.ordinario - G.costo;
  const operacional = bruto - G.oper + G.otrosIng;
  const antesImp = operacional - G.fin;
  return {ingresos:G.ordinario, otrosIng:G.otrosIng, costo:G.costo, bruto,
          oper:G.oper, operacional, fin:G.fin, antesImp, imp:G.imp,
          neto: antesImp - G.imp, fuera};
}
function esf(lista){
  const {G, fuera} = clasificar(lista);
  const res = eri(lista).neto;
  return {ac:G.ac, anc:G.anc, activo:G.ac+G.anc,
          pc:G.pc, pnc:G.pnc, pasivo:G.pc+G.pnc,
          cap:G.cap, uac:G.uac, ret:G.ret, res,
          patrimonio:G.cap+G.uac-G.ret+res,
          total:G.pc+G.pnc+G.cap+G.uac-G.ret+res, fuera};
}

              + (d.folio?('N° '+d.folio+' '):'') + (d.contraparte||'');

  if(d.clase==='venta'){
    const cli = ctaPago || '1103';
    if(!nc){
      const ing = d.neto + d.exento;
      L.push({c:cli, d:d.total});
      if(ing)   L.push({c:d.cuenta, h:ing});
      if(d.iva) L.push({c:'2103', h:d.iva});
      if(d.ila) L.push({c:'2109', h:d.ila});
    }else{
      const ing = d.neto + d.exento;
      if(ing)   L.push({c:d.cuenta, d:ing});
      if(d.iva) L.push({c:'2103', d:d.iva});
      if(d.ila) L.push({c:'2109', d:d.ila});
      L.push({c:cli, h:d.total});
    }
  } else if(d.clase==='compra'){
    const prov = ctaPago || '2101';
    const sinCred = !d.creditoIva;
    const cargo = d.neto + d.exento + (sinCred ? d.iva + d.ila : 0);
    if(!nc){
      if(cargo) L.push({c:d.cuenta, d:cargo});
      if(!sinCred && d.iva) L.push({c:'1106', d:d.iva});
      if(!sinCred && d.ila) L.push({c:'1110', d:d.ila});
      L.push({c:prov, h:d.total});
    }else{
      L.push({c:prov, d:d.total});
      if(cargo) L.push({c:d.cuenta, h:cargo});
      if(!sinCred && d.iva) L.push({c:'1106', h:d.iva});
      if(!sinCred && d.ila) L.push({c:'1110', h:d.ila});
    }
  } else { // honorario recibido
    L.push({c:d.cuenta||'5109', d:d.neto});
    if(d.retencion) L.push({c:'2105', h:d.retencion});
    L.push({c: ctaPago || '2101', h: d.neto - d.retencion});
  }
  return {glosa, lineas:L};
}
function registrarDoc(d){
  const a = asientoDeDoc(d);
  const as = addAsiento(d.fecha, a.glosa, a.lineas, 'doc', d.id);
  d.asientos = as ? [as.id] : [];
  // costo de venta, asiento separado (inventario permanente)
  if(d.clase==='venta' && S.emp.inventarioPermanente && num(d.costo)>0){

function borrarDoc(id){

}

/* ---------------------- 7. circuito tributario: F29 ------------------- */
function docsMes(ym){ return S.docs.filter(d=>ymOf(d.fecha)===ym); }

function f29Mes(ym, remanenteAnt){
  const L = docsMes(ym);
  let debFact=0, debBol=0, debNC=0, exentas=0, netoAfecto=0, netoExento=0;
  let cred=0, credNC=0, comprasNeto=0, ilaD=0, ilaC=0, ret=0, honBruto=0, sinCredito=0;
  L.forEach(d=>{
    if(d.clase==='venta'){
      const s = d.nc?-1:1;
      if(d.dte==='39'||d.dte==='41') debBol += s*d.iva; else debFact += s*d.iva;
      if(d.nc) debNC += d.iva;
      netoAfecto += s*d.neto; netoExento += s*d.exento; exentas += s*d.exento;
      ilaD += s*d.ila;
    } else if(d.clase==='compra'){
      const s = d.nc?-1:1;
      comprasNeto += s*(d.neto+d.exento);
      if(d.creditoIva){ cred += s*d.iva; ilaC += s*d.ila; if(d.nc) credNC += d.iva; }
      else sinCredito += s*(d.neto+d.exento+d.iva);
    } else { ret += d.retencion; honBruto += d.neto; }
  });
  const debito = debFact + debBol;
  const credTotal = cred + num(remanenteAnt);
  const ivaDet = debito - credTotal;
  const aPagarIVA = Math.max(ivaDet, 0);
  const remanenteSig = Math.max(-ivaDet, 0);
  const ilaNeto = ilaD - ilaC;

  const ano = +ym.slice(0,4);
  let tPPM = S.emp.ppmManual!=='' && S.emp.ppmManual!=null ? num(S.emp.ppmManual)/100
                                                           : tasaPPM(S.emp.regimen, ano, S.emp.sobre50kUF);
  const basePPM = netoAfecto + netoExento;
  const ppm = tPPM==null ? 0 : R(basePPM * tPPM);

  return {ym, debFact, debBol, debNC, debito, cred, credNC, remanenteAnt:num(remanenteAnt), credTotal,
          ivaDet, aPagarIVA, remanenteSig, ilaD, ilaC, ilaNeto, ret, honBruto,
          netoAfecto, netoExento, exentas, comprasNeto, sinCredito, basePPM, tPPM, ppm,
          total: aPagarIVA + Math.max(ilaNeto,0) + ppm + ret, docs:L.length};
}
function f29Ano(){
  const out=[]; let rem = num(S.par.remanenteInicial);
  for(let m=1;m<=12;m++){
    const ym = S.emp.ejercicio + '-' + String(m).padStart(2,'0');
    const r = f29Mes(ym, rem); rem = r.remanenteSig; out.push(r);
  }
  return out;
}
function acumTrib(hastaMes){
  const a = f29Ano().slice(0, hastaMes==null?12:hastaMes+1);
  return a.reduce((t,r)=>({
    ventasNetas:t.ventasNetas+r.netoAfecto, exentas:t.exentas+r.netoExento,
    compras:t.compras+r.comprasNeto, ppm:t.ppm+r.ppm, ret:t.ret+r.ret,
    ivaPagado:t.ivaPagado+r.aPagarIVA, ila:t.ila+Math.max(r.ilaNeto,0), hon:t.hon+r.honBruto
  }), {ventasNetas:0,exentas:0,compras:0,ppm:0,ret:0,ivaPagado:0,ila:0,hon:0});
}


/* ---------------------- 7a. lectura de archivos ----------------------- */
// Acepta lo que entregan los bancos y el SII: CSV, Excel moderno (.xlsx) y los
// falsos .xls que en realidad son una tabla HTML. Sin librerías externas: el
// .xlsx es un ZIP con XML adentro, y el navegador ya sabe descomprimir.

function decodificarTexto(u8){
  let t = new TextDecoder('utf-8').decode(u8);
  // Si aparecen caracteres rotos, el archivo venía en Windows-1252.
  if(/\uFFFD/.test(t)){ try{ t = new TextDecoder('windows-1252').decode(u8); }catch(e){} }
  return t.replace(/^\uFEFF/,'');
}

/* --- ZIP: solo lo necesario para sacar unos pocos archivos --- */
async function inflar(u8, metodo){
  if(metodo === 0) return u8;                       // guardado sin comprimir
  if(typeof DecompressionStream === 'undefined')
    throw new Error('Este navegador no puede abrir archivos Excel. Guarda la planilla como CSV y súbela así.');
  const ds = new DecompressionStream('deflate-raw');
  const buf = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}
function leerZip(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('El archivo no parece un Excel válido.');
  const total = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const entradas = {};
  for(let i = 0; i < total; i++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const metodo = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nLen = dv.getUint16(off + 28, true);
    const eLen = dv.getUint16(off + 30, true);
    const cLen = dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const nombre = new TextDecoder('utf-8').decode(u8.subarray(off + 46, off + 46 + nLen));
    entradas[nombre] = {metodo, compSize, local};
    off += 46 + nLen + eLen + cLen;
  }
  return {dv, entradas};
}
async function sacarDelZip(u8, zip, nombre){
  const e = zip.entradas[nombre]; if(!e) return null;
  const nLen = zip.dv.getUint16(e.local + 26, true);
  const eLen = zip.dv.getUint16(e.local + 28, true);
  const ini = e.local + 30 + nLen + eLen;
  return decodificarTexto(await inflar(u8.subarray(ini, ini + e.compSize), e.metodo));
}

/* --- XLSX --- */
const colDeRef = r => { let n = 0; for(const c of r.replace(/\d/g,'')) n = n*26 + (c.charCodeAt(0) - 64); return n - 1; };
// Excel guarda las fechas como número de días desde el 30-12-1899.
function serialAFecha(n){
  const ms = Math.round((n - 25569) * 86400000);
  return new Date(ms).toISOString().slice(0,10);
}
const FMT_FECHA = new Set([14,15,16,17,18,19,20,21,22,27,30,36,45,46,47,50,57]);

async function leerXLSX(u8){
  const zip = leerZip(u8);
  const px = t => new DOMParser().parseFromString(t, 'application/xml');

  // textos compartidos
  const ssTxt = await sacarDelZip(u8, zip, 'xl/sharedStrings.xml');
  const shared = [];
  if(ssTxt) px(ssTxt).querySelectorAll('si').forEach(si=>{
    shared.push(Array.from(si.querySelectorAll('t')).map(t=>t.textContent).join(''));
  });

  // estilos: para saber qué celdas son fechas
  const stTxt = await sacarDelZip(u8, zip, 'xl/styles.xml');
  const esFecha = [];
  if(stTxt){
    const st = px(stTxt), custom = {};
    st.querySelectorAll('numFmt').forEach(f=>{
      const id = +f.getAttribute('numFmtId'), code = f.getAttribute('formatCode')||'';
      custom[id] = /[dmyhs]/i.test(code.replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,''));
    });
    const xfs = st.querySelector('cellXfs');
    if(xfs) Array.from(xfs.children).forEach(xf=>{
      const id = +(xf.getAttribute('numFmtId')||0);
      esFecha.push(FMT_FECHA.has(id) || custom[id] === true);
    });
  }

  // primera hoja con datos
  let hoja = null;
  for(const n of Object.keys(zip.entradas)){
    if(/^xl\/worksheets\/sheet\d+\.xml$/.test(n)){ hoja = hoja && hoja < n ? hoja : n; }
  }
  if(!hoja) throw new Error('El Excel no tiene hojas legibles.');
  const wsTxt = await sacarDelZip(u8, zip, hoja);
  const ws = px(wsTxt), filas = [];

  ws.querySelectorAll('row').forEach(row=>{
    const f = [];
    row.querySelectorAll('c').forEach(c=>{
      const ref = c.getAttribute('r') || '', tipo = c.getAttribute('t');
      const col = ref ? colDeRef(ref) : f.length;
      let v = '';
      if(tipo === 's'){ v = shared[+(c.querySelector('v')?.textContent || 0)] || ''; }
      else if(tipo === 'inlineStr'){ v = Array.from(c.querySelectorAll('t')).map(t=>t.textContent).join(''); }
      else {
        const t = c.querySelector('v')?.textContent;
        if(t == null || t === '') v = '';
        else {
          const st = +(c.getAttribute('s') || -1);
          const n = parseFloat(t);
          v = (esFecha[st] && isFinite(n) && n > 1 && n < 2958466) ? serialAFecha(n) : t;
        }
      }
      while(f.length < col) f.push('');
      f[col] = v;
    });
    filas.push(f);
  });
  return filas.filter(f=>f.some(x=>String(x).trim() !== ''));
}

/* --- tabla HTML: los .xls falsos que entregan varios bancos --- */
function leerTablaHTML(txt){
  const doc = new DOMParser().parseFromString(txt, 'text/html');
  const tablas = Array.from(doc.querySelectorAll('table'));
  if(!tablas.length) return null;
  const t = tablas.sort((a,b)=> b.querySelectorAll('tr').length - a.querySelectorAll('tr').length)[0];
  const filas = [];
  t.querySelectorAll('tr').forEach(tr=>{
    const f = Array.from(tr.querySelectorAll('td,th'))
      .map(c=> c.textContent.replace(/\u00a0/g,' ').trim());
    if(f.some(x=>x!=='')) filas.push(f);
  });
  return filas;
}

// Devuelve {filas} cuando pudo armar la tabla, o {texto} cuando es un CSV.
async function leerArchivoTabla(file){
  const u8 = new Uint8Array(await file.arrayBuffer());
  if(u8[0]===0x50 && u8[1]===0x4B && u8[2]===0x03)            // PK: xlsx
    return {filas: await leerXLSX(u8)};
  if(u8[0]===0xD0 && u8[1]===0xCF && u8[2]===0x11)            // .xls antiguo
    throw new Error('Es un Excel formato antiguo (.xls). Ábrelo y guárdalo como .xlsx o como CSV, y vuelve a subirlo.');
  const txt = decodificarTexto(u8);
  if(/<\s*table/i.test(txt)){
    const filas = leerTablaHTML(txt);
    if(filas && filas.length > 1) return {filas};
  }
  return {texto: txt};
}
// Para mostrar en el cuadro de texto lo que se leyó de un Excel.
const filasATexto = filas => filas.map(f=>f.map(c=>String(c).replace(/;/g,',')).join(';')).join('\n');

/* ---------------------- 7b. importador de CSV -------------------------- */
// Pensado para el registro de compras y ventas que descargas del SII, pero
// tolerante: reconoce las columnas por su nombre, no por su posición, así que
// también sirve para una planilla armada a mano o exportada de otro sistema.

function normCab(t){
  return String(t||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // saca tildes
    .replace(/[^a-z0-9]/g,'');
}
// En una columna de montos chilena el punto siempre separa miles.
function numCSV(v){
  if(typeof v === 'number') return v;
  let t = String(v==null?'':v).replace(/[\s$"']/g,'');
  if(!t || t==='-') return 0;
  const neg = /^\(.*\)$/.test(t) || t.startsWith('-');
  t = t.replace(/[()\-]/g,'');
  if(t.indexOf(',')>=0) t = t.replace(/\./g,'').replace(',','.');
  else t = t.replace(/\./g,'');
  const n = parseFloat(t);
  return isNaN(n) ? 0 : (neg ? -n : n);
}
function detectarDelim(txt){
  const l = txt.split(/\r?\n/).find(x=>x.trim()) || '';
  const cuenta = d => (l.match(new RegExp('\\'+d,'g'))||[]).length;
  return [[';',cuenta(';')],[',',cuenta(',')],['\t',cuenta('\t')],['|',cuenta('|')]]
    .sort((a,b)=>b[1]-a[1])[0][0];
}
function parseCSV(txt, delim){
  const filas=[]; let f=[], campo='', comilla=false;
  txt = txt.replace(/^\uFEFF/,'');
  for(let i=0;i<txt.length;i++){
    const c = txt[i];
    if(comilla){
      if(c==='"'){ if(txt[i+1]==='"'){ campo+='"'; i++; } else comilla=false; }
      else campo+=c;
    } else if(c==='"') comilla=true;
    else if(c===delim){ f.push(campo); campo=''; }
    else if(c==='\n'){ f.push(campo); filas.push(f); f=[]; campo=''; }
    else if(c!=='\r') campo+=c;
  }
  if(campo!=='' || f.length){ f.push(campo); filas.push(f); }
  return filas.filter(x=>x.some(y=>String(y).trim()!==''));
}

// Sinónimos de cada campo, del más específico al más genérico.
const COLS = {
  fecha:  ['fechadocto','fechadocumento','fechaemision','fechadeemision','fecha'],
  tipo:   ['tipodoc','tipodocumento','tipodte','tipodocto','tipo'],
  folio:  ['folio','nrodocumento','numerodocumento','ndocumento','numero','nro'],
  rut:    ['rutproveedor','rutcliente','rutemisor','rutreceptor','rut'],
  nombre: ['razonsocial','nombreproveedor','nombrecliente','proveedor','cliente','razon','nombre'],
  exento: ['montoexentoonogravado','montoexento','exentoonogravado','exento'],
  neto:   ['montoneto','neto'],
  iva:    ['montoivarecuperable','montoiva','iva'],
  ivaNR:  ['montoivanorecuperable','ivanorecuperable'],
  ivaUC:  ['montoivausocomun','ivausocomun'],
  otros:  ['valorotroimpuesto','montootroimpuesto','otroimpuesto','impuestoadicional'],
  total:  ['montototal','total']
};
// Columnas que nunca deben capturarse: distorsionan los totales si se confunden.
const PROHIBIDAS = ['montonetoactivofijo','montoivaactivofijo','tasaotroimpuesto',
                    'codigootroimpuesto','codigoivanorecuperable','montoivaretenidototal'];

function mapearColumnas(cab){
  const N = cab.map(normCab);
  const mapa = {}, usadas = new Set();
  for(const campo of Object.keys(COLS)){
    for(const clave of COLS[campo]){
      let i = N.findIndex((n,ix)=> n===clave && !usadas.has(ix) && !PROHIBIDAS.includes(n));
      if(i<0) i = N.findIndex((n,ix)=> n.indexOf(clave)===0 && !usadas.has(ix) && !PROHIBIDAS.includes(n));
      if(i<0) i = N.findIndex((n,ix)=> n.indexOf(clave)>=0 && !usadas.has(ix) && !PROHIBIDAS.includes(n));
      if(i>=0){ mapa[campo]=i; usadas.add(i); break; }
    }
  }
  return mapa;
}
function adivinarClase(cab){
  const N = cab.map(normCab).join('|');
  if(N.indexOf('ivarecuperable')>=0 || N.indexOf('rutproveedor')>=0 || N.indexOf('tipocompra')>=0) return 'compra';
  if(N.indexOf('rutcliente')>=0 || N.indexOf('tipoventa')>=0) return 'venta';
  return null;
}
function fechaISO(v, anoDefecto){
  const t = String(v||'').trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);                   if(m) return m[0];
  m = t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);       // dd/mm/aaaa
  if(m){ let a = m[3].length===2 ? '20'+m[3] : m[3];
         return a+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
  m = t.match(/^(\d{4})(\d{2})(\d{2})$/);                        if(m) return m[1]+'-'+m[2]+'-'+m[3];
  return anoDefecto ? anoDefecto+'-01-01' : '';
}

function analizarImport(txt, claseForzada, anoDefecto, filasPre){
  const delim = filasPre ? null : detectarDelim(txt);
  const filas = filasPre || parseCSV(txt, delim);
  if(filas.length < 2) return {error:'El archivo no tiene filas suficientes. ¿Seguro que es el CSV correcto?'};
  const cab = filas[0];
  const mapa = mapearColumnas(cab);
  const clase = claseForzada || adivinarClase(cab) || 'compra';
  if(mapa.total===undefined && mapa.neto===undefined)
    return {error:'No encuentro ninguna columna de montos. Revisa que la primera fila del archivo sean los títulos de las columnas.'};

  const g = (f,k)=> mapa[k]===undefined ? '' : (f[mapa[k]]||'');
  const filas2 = filas.slice(1), docs = [], problemas = [];
  const yaEstan = new Set(S.docs.map(d=>d.clase+'|'+d.dte+'|'+d.folio+'|'+(d.rut||'')));
  let repetidos = 0;

  filas2.forEach((f, i)=>{
    const tipo = String(g(f,'tipo')).trim().replace(/\D/g,'') || '33';
    const folio = String(g(f,'folio')).trim();
    const fecha = fechaISO(g(f,'fecha'), anoDefecto);
    const rut = String(g(f,'rut')).trim();

    let neto = numCSV(g(f,'neto')), exento = numCSV(g(f,'exento'));
    let iva = numCSV(g(f,'iva')) + numCSV(g(f,'ivaUC'));
    const ivaNR = numCSV(g(f,'ivaNR'));
    let otros = numCSV(g(f,'otros'));
    let total = numCSV(g(f,'total'));

    // Una nota de crédito viene con tipo 61, o con los montos en negativo.
    const negativo = (total||neto) < 0;
    const nc = tipo==='61' || negativo;
    if(negativo){ neto=Math.abs(neto); exento=Math.abs(exento); iva=Math.abs(iva);
                  otros=Math.abs(otros); total=Math.abs(total); }

    if(!total) total = neto + exento + iva + ivaNR + otros;
    if(!neto && !exento && total) { neto = R(total/(1+IVA)); iva = total - neto; }
    if(total<=0){ problemas.push('fila '+(i+2)+': sin monto'); return; }

    const llave = clase+'|'+tipo+'|'+folio+'|'+rut;
    if(yaEstan.has(llave)){ repetidos++; return; }
    yaEstan.add(llave);

    docs.push({fila:i+2, fecha, dte:tipo, folio, rut,
      contraparte: String(g(f,'nombre')).trim(),
      neto:R(neto), exento:R(exento), iva:R(iva), ila:R(otros), ivaNR:R(ivaNR),
      total:R(total), nc, clase});
  });
  return {delim, cab, mapa, clase, docs, problemas, repetidos, leidas:filas2.length};
}

function confirmarImport(an, cuenta, creditoIva){
  let n = 0;
  an.docs.forEach(d=>{
    const doc = {id:uid(), fecha:d.fecha, clase:an.clase, dte:d.dte, folio:d.folio,
      contraparte:d.contraparte, rut:d.rut,
      neto:d.neto, exento:d.exento, iva:d.iva, ila:d.ila, retencion:0, total:d.total,
      ilaTasa:0, condicion:'credito', cuenta:cuenta,
      creditoIva: an.clase==='compra' ? (creditoIva && d.iva>0) : false,
      costo:0, nc:d.nc, importado:true};
    registrarDoc(doc); n++;
  });
  return n;
}


/* ---------------------- 7c. cartola y conciliación -------------------- */
// La cartola se cruza contra dos cosas: los movimientos de la cuenta banco en
// el libro diario, y los documentos del registro de compras y ventas que
// todavía están por cobrar o por pagar.

const COLS_BCO = {
  fecha:  ['fechatransaccion','fechamovimiento','fechacontable','fechaoperacion','fecha'],
  glosa:  ['descripcion','detalle','glosa','detalledelmovimiento','concepto','movimiento','transaccion'],
  ref:    ['ndocumento','numerodocumento','ndeoperacion','documento','referencia','canalosucursal','canal'],
  cargo:  ['cargosclp','cargos','cargo','debito','debitos','giro','giros'],
  abono:  ['abonosclp','abonos','abono','credito','creditos','deposito','depositos'],
  monto:  ['montoclp','monto','importe','valor'],
  saldo:  ['saldoclp','saldo','saldocontable']
};
function mapearBanco(cab){
  const N = cab.map(normCab), mapa = {}, usadas = new Set();
  for(const campo of Object.keys(COLS_BCO)){
    for(const clave of COLS_BCO[campo]){
      let i = N.findIndex((n,ix)=> n===clave && !usadas.has(ix));
      if(i<0) i = N.findIndex((n,ix)=> n.indexOf(clave)===0 && !usadas.has(ix));
      if(i<0) i = N.findIndex((n,ix)=> n.indexOf(clave)>=0 && !usadas.has(ix));
      if(i>=0){ mapa[campo]=i; usadas.add(i); break; }
    }
  }
  return mapa;
}
function analizarCartola(txt, anoDefecto, filasPre){
  const delim = filasPre ? null : detectarDelim(txt);
  const filas = filasPre || parseCSV(txt, delim);
  if(filas.length < 2) return {error:'El archivo no tiene filas suficientes.'};
  // Las cartolas suelen traer líneas de encabezado antes de la tabla:
  // se busca la fila que tenga pinta de títulos de columna.
  let ini = 0, mapa = mapearBanco(filas[0]);
  for(let i=0;i<Math.min(filas.length,15);i++){
    const m = mapearBanco(filas[i]);
    if(m.fecha!==undefined && (m.cargo!==undefined || m.abono!==undefined || m.monto!==undefined)){ ini=i; mapa=m; break; }
  }
  if(mapa.fecha===undefined)
    return {error:'No encuentro la columna de fechas. Revisa que el archivo tenga una fila con los títulos de las columnas.'};
  if(mapa.cargo===undefined && mapa.abono===undefined && mapa.monto===undefined)
    return {error:'No encuentro columnas de cargo, abono ni monto.'};

  const cab = filas[ini], g = (f,k)=> mapa[k]===undefined ? '' : (f[mapa[k]]||'');
  const movs = [], problemas = [];
  const yaEstan = new Set((S.banco.movs||[]).map(m=>m.fecha+'|'+m.monto+'|'+normCab(m.glosa).slice(0,24)));
  let repetidos = 0;

  filas.slice(ini+1).forEach((f,i)=>{
    const crudo = String(g(f,'fecha')).trim();
    const fecha = fechaISO(crudo, null);
    // Sin fecha legible no es un movimiento: es una fila de totales o de texto.
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha) || !/\d/.test(crudo)) return;
    let monto;
    if(mapa.cargo!==undefined || mapa.abono!==undefined){
      monto = Math.abs(numCSV(g(f,'abono'))) - Math.abs(numCSV(g(f,'cargo')));
    } else monto = numCSV(g(f,'monto'));
    if(!monto){ problemas.push('fila '+(i+ini+2)+': sin monto'); return; }
    const glosa = String(g(f,'glosa')).trim() || String(g(f,'ref')).trim() || 'Movimiento bancario';
    const llave = fecha+'|'+R(monto)+'|'+normCab(glosa).slice(0,24);
    if(yaEstan.has(llave)){ repetidos++; return; }
    yaEstan.add(llave);
    movs.push({id:uid(), fecha, glosa, ref:String(g(f,'ref')).trim(),
               monto:R(monto), saldo: mapa.saldo!==undefined ? R(numCSV(g(f,'saldo'))) : null,
               aid:null, docId:null});
  });
  movs.sort((a,b)=> a.fecha<b.fecha?-1:1);
  return {delim, cab, mapa, movs, problemas, repetidos, leidas:filas.length-ini-1};
}

// Movimientos de la cuenta banco en el libro diario.
function movimientosLibro(){
  const out = [];
  asientosDelEjercicio().forEach(a=> a.lineas.forEach(l=>{
    if(l.c !== S.banco.cuenta) return;
    out.push({aid:a.id, n:a.n, fecha:a.fecha, glosa:a.glosa, monto: num(l.d) - num(l.h)});
  }));
  return out.sort((a,b)=> a.fecha<b.fecha?-1:1);
}
const diasEntre = (a,b) => Math.abs((new Date(a+'T12:00:00') - new Date(b+'T12:00:00'))/86400000);
const soloDig = t => String(t||'').replace(/\D/g,'');

// Documentos que todavía no tienen pago o cobro registrado.
function docsPendientes(){
  const pagados = new Set((S.banco.movs||[]).filter(m=>m.docId).map(m=>m.docId));
  return S.docs.filter(d=> d.condicion==='credito' && !pagados.has(d.id) && !d.nc);
}

function emparejar(){
  const movs = (S.banco.movs||[]).slice();
  const lib = movimientosLibro();
  const usadosLib = new Set(movs.filter(m=>m.aid).map(m=>m.aid));
  const pares = [], soloBanco = [];

  // 1. Calce con el libro: mismo monto, mismo signo, fechas cercanas.
  movs.forEach(m=>{
    if(m.aid){ const l = lib.find(x=>x.aid===m.aid); if(l){ pares.push({m, l, fijo:true}); return; } m.aid=null; }
    const cand = lib.filter(l=> !usadosLib.has(l.aid) && Math.abs(l.monto - m.monto) <= 1)
                    .sort((a,b)=> diasEntre(a.fecha,m.fecha) - diasEntre(b.fecha,m.fecha));
    if(cand.length && diasEntre(cand[0].fecha, m.fecha) <= 7){
      usadosLib.add(cand[0].aid); pares.push({m, l:cand[0], fijo:false});
    } else soloBanco.push(m);
  });
  const soloLibro = lib.filter(l=> !usadosLib.has(l.aid));

  // 2. Lo que queda del banco se cruza contra los documentos del SII.
  const pend = docsPendientes(), usadosDoc = new Set();
  soloBanco.forEach(m=>{
    if(m.docId) return;
    const esAbono = m.monto > 0;
    const cands = pend.filter(d=>{
      if(usadosDoc.has(d.id)) return false;
      if(esAbono && d.clase!=='venta') return false;
      if(!esAbono && d.clase!=='compra') return false;
      return Math.abs(d.total - Math.abs(m.monto)) <= 1;
    }).map(d=>{
      let punt = 0;
      const dd = diasEntre(d.fecha, m.fecha);
      punt += dd<=45 ? (45-dd) : 0;
      const dig = soloDig(d.rut).slice(0,8);
      if(dig && soloDig(m.glosa+' '+m.ref).indexOf(dig)>=0) punt += 200;          // el RUT en la glosa
      if(d.folio && soloDig(m.glosa+' '+m.ref).indexOf(soloDig(d.folio))>=0) punt += 120;
      const nom = normCab(d.contraparte||'').slice(0,9);
      if(nom.length>4 && normCab(m.glosa).indexOf(nom)>=0) punt += 150;           // el nombre
      return {d, punt, dd};
    }).sort((a,b)=> b.punt - a.punt);
    if(cands.length && cands[0].dd <= 120){ m.sug = cands[0]; usadosDoc.add(cands[0].d.id); }
    else m.sug = null;
  });

  return {pares, soloBanco, soloLibro, lib};
}

function claveGlosa(g){

function cuentaSugerida(m){
  const aprendida = (S.banco.reglas||{})[claveGlosa(m.glosa)];
  if(aprendida && CTA[aprendida]) return [aprendida, 'ya lo registraste así antes'];
  const g = normCab(m.glosa);
  const tiene = (...ks) => ks.some(k=>g.indexOf(k)>=0);
  if(m.monto < 0){
    if(tiene('comision','mantencion','administracion','cobro','cartola')) return ['5104','Comisión o mantención bancaria'];
    if(tiene('interes','credito','cuota','prestamo')) return ['5106','Intereses o gastos financieros'];
    if(tiene('impuesto','timbre','estampilla','giro')) return ['5104','Impuesto o gasto bancario'];
    if(tiene('remuneracion','sueldo','nomina')) return ['2104','Pago de remuneraciones'];
    if(tiene('previred','afp','isapre','fonasa','cotizacion')) return ['2106','Pago de cotizaciones'];
    if(tiene('tesoreria','sii','f29','iva','ppm')) return ['2105','Pago de impuestos'];
    if(tiene('proveedor','pago','transferencia')) return ['2101','Pago a proveedores'];
    return ['5104','Gastos Generales'];
  }
  if(tiene('interes','reajuste','rentabilidad')) return ['4103','Intereses ganados'];
  if(tiene('devolucion','reembolso','tesoreria')) return ['2105','Devolución de impuestos'];
  if(tiene('aporte','capital','socio')) return ['3101','Aporte de capital'];
  if(tiene('prestamo','credito')) return ['2201','Préstamo recibido'];
  return ['1103','Cobro a clientes'];
}

function informeConciliacion(hasta){
  const E = emparejar();
  const corte = hasta || (S.banco.movs.length ? S.banco.movs[S.banco.movs.length-1].fecha : hoyISO());
  const dentro = x => x.fecha <= corte;

  // Saldo según la cartola: el último saldo informado, o la suma de movimientos
  // más el saldo inicial que haya cargado el usuario.
  const conSaldo = S.banco.movs.filter(m=>dentro(m) && m.saldo!==null);
  const saldoCartola = conSaldo.length ? conSaldo[conSaldo.length-1].saldo
    : num(S.banco.saldoInicial) + S.banco.movs.filter(dentro).reduce((a,m)=>a+m.monto,0);

  const saldoLibro = movimientosLibro().filter(dentro).reduce((a,l)=>a+l.monto,0);

  const depTransito = E.soloLibro.filter(l=>dentro(l) && l.monto>0).reduce((a,l)=>a+l.monto,0);
  const chequesNo  = E.soloLibro.filter(l=>dentro(l) && l.monto<0).reduce((a,l)=>a-l.monto,0);
  const abonosNoReg = E.soloBanco.filter(m=>dentro(m) && m.monto>0).reduce((a,m)=>a+m.monto,0);
  const cargosNoReg = E.soloBanco.filter(m=>dentro(m) && m.monto<0).reduce((a,m)=>a-m.monto,0);

  const ajustadoBanco = saldoCartola + depTransito - chequesNo;
  const ajustadoLibro = saldoLibro + abonosNoReg - cargosNoReg;

  return {E, corte, saldoCartola, saldoLibro, depTransito, chequesNo, abonosNoReg, cargosNoReg,
          ajustadoBanco, ajustadoLibro, dif: R(ajustadoBanco) - R(ajustadoLibro),
          cuadra: Math.abs(R(ajustadoBanco) - R(ajustadoLibro)) <= 2};
}

/* ---------------------- 8. renta y planificación ---------------------- */
function igc(baseCLP, utaCLP){
  if(!utaCLP || baseCLP<=0) return 0;
  const uta = baseCLP/utaCLP; let t=0, r=0;
  for(const x of TRAMOS_IGC){ if(uta<=x.h){ t=x.t; r=x.r; break; } }
  return Math.max(R(baseCLP*t - r*utaCLP), 0);
}
function renta(){
  const lista = asientosDelEjercicio();
  const r = eri(lista);
  const aj = S.ajustes;
  const rliBruta = r.antesImp + num(aj.gastosRechazados) - num(aj.ingresosNoRenta) + num(aj.otros);
  const topeReinv = 5000 * num(S.par.uf);
  const reinv = Math.min(num(aj.reinversion), Math.max(rliBruta,0)*0.5, topeReinv);
  const rli = Math.max(rliBruta - reinv, 0);
  const tasa = tasaIDPC(S.emp.regimen, S.emp.ejercicio);
  const idpc = R(rli*tasa);
  const ppm = acumTrib().ppm;
  const cred = num(aj.creditos);
  const saldo = idpc - ppm - cred;
  return {eri:r, rliBruta, reinv, topeReinv, rli, tasa, idpc, ppm, cred, saldo};
}
function comparaRegimenes(){
  const R0 = renta(), uta = num(S.par.utm)*12, retiros = num(S.ajustes.retirosDueno);
  const out=[];
  for(const k of ['14D3','14D8','14A']){
    const t = tasaIDPC(k, S.emp.ejercicio);
    const emp = R(R0.rli*t);
    let due=0, nota='';
    if(k==='14D8'){ due = igc(R0.rli, uta); nota='el dueño tributa por toda la RLI, retire o no'; }
    else{
      const base = retiros;
      const credF = k==='14A' ? 0.65 : 1;                    // en el 14 A el crédito se imputa solo en un 65%
      const incr = Math.min(R(base*t/(1-t)), emp);           // el crédito no puede exceder el IDPC pagado
      const bruta = igc(base+incr, uta);
      due = R(bruta - incr*credF);
      if(k==='14A') due = Math.max(due, 0);                  // el exceso de crédito parcial no se devuelve
      nota = k==='14A' ? 'crédito por IDPC imputable solo en un 65%' : 'crédito por IDPC imputable al 100%';
    }
    out.push({k, nom:REG_CORTO[k], art:REG_ART[k], tasa:t, emp, due, total:emp+due, nota});
  }
  return out;
}

/* ---------------------- 8b. remuneraciones ---------------------------- */
function porTabla(base, unidad, tabla){
  if(!unidad || base<=0) return 0;
  const u = base/unidad; let t=0, r=0;
  for(const x of tabla){ if(u<=x.h){ t=x.t; r=x.r; break; } }
  return Math.max(R(base*t - r*unidad), 0);
}
function tramoAsigFam(renta, tramos){
  for(const x of tramos){ if(renta<=x.h) return x; }
  return tramos[tramos.length-1];
}
function liquidacion(L, fecha){
  const P = prev(fecha), uf = num(S.par.uf), utm = num(S.par.utm);
  const base = R(num(L.sueldo)), extra = R(num(L.extra)), bonos = R(num(L.bonos));
  const topeGrat = R(P.gratifTopeIMM * P.imm.gen / 12);
  const grat = L.gratifAuto ? Math.min(R((base+extra+bonos)*0.25), topeGrat) : R(num(L.gratif));
  const imponible = base + extra + bonos + grat;

  const topeAfp = R(P.topes.afp*uf), topeAfc = R(P.topes.afc*uf);
  const riAfp = Math.min(imponible, topeAfp), riAfc = Math.min(imponible, topeAfc);

  const afp = R(riAfp * num(L.afp));
  const saludLegal = R(riAfp * P.salud);
  const salud = L.salud==='isapre' ? Math.max(R(num(L.planUF)*uf), saludLegal) : saludLegal;
  const adicSalud = salud - saludLegal;
  const afcTrab = L.contrato==='indefinido' ? R(riAfc * P.afc.indefTrab) : 0;

  const baseTrib = imponible - afp - salud - afcTrab;
  const iusc = porTabla(baseTrib, utm, P.iusc);

  const tr = tramoAsigFam(imponible, P.asigFam);
  const af = R(tr.m * Math.max(0, parseInt(L.cargas)||0));
  const noImp = R(num(L.colacion)) + R(num(L.movilizacion)) + R(num(L.otrosNoImp));
  const otros = R(num(L.otrosDesc));

  const descuentos = afp + salud + afcTrab + iusc + otros;
  const liquido = imponible + noImp + af - descuentos;

  const aporte = R(riAfp * P.aporte.t);
  const sis    = P.sis ? R(riAfp * P.sis) : 0;
  const afcEmp = R(riAfc * (L.contrato==='indefinido' ? P.afc.indefEmp : P.afc.plazoEmp));
  const mutual = R(riAfp * P.mutual);
  const leyes  = aporte + sis + afcEmp + mutual;

  return {P, base, extra, bonos, grat, topeGrat, imponible, noImp, topeAfp, topeAfc, riAfp, riAfc,
          afp, salud, saludLegal, adicSalud, afcTrab, baseTrib, iusc, af, tramoAF:tr, otros,
          descuentos, liquido, aporte, sis, afcEmp, mutual, leyes,
          costoTotal: imponible + noImp + leyes,
          topado: imponible > topeAfp,
          bajoMinimo: base > 0 && base < P.imm.gen};
}
function asientosRemuneracion(L, fecha, q){
  const mes = MESES[+fecha.slice(5,7)-1] + ' ' + fecha.slice(0,4);
  const quien = L.nombre ? ' ' + L.nombre : '';

    {c:'2106', d:previred}, {c:'1102', h:previred}]});
  return A;
}

// Código del Trabajo: Arts. 159, 160, 161 (causales), 162 (aviso previo),
// 163 y 172 (indemnización por años de servicio y su base), 67 a 73 (feriado).

const CAUSALES = [
  {k:'159-2',  n:'Renuncia voluntaria (Art. 159 N°2)',                 ias:false, aviso:false},
  {k:'159-1',  n:'Mutuo acuerdo de las partes (Art. 159 N°1)',         ias:false, aviso:false},
  {k:'159-4',  n:'Vencimiento del plazo convenido (Art. 159 N°4)',     ias:false, aviso:false},
  {k:'159-5',  n:'Conclusión del trabajo o servicio (Art. 159 N°5)',   ias:false, aviso:false},
  {k:'160',    n:'Causal imputable al trabajador (Art. 160)',          ias:false, aviso:false},
  {k:'161-1',  n:'Necesidades de la empresa (Art. 161 inc. 1)',        ias:true,  aviso:true},
  {k:'161-2',  n:'Desahucio del empleador (Art. 161 inc. 2)',          ias:true,  aviso:true},
  {k:'163bis', n:'Liquidación concursal del empleador (Art. 163 bis)', ias:true,  aviso:true}
];
const causal = k => CAUSALES.find(c=>c.k===k) || CAUSALES[0];

// Meses completos y días de fracción entre dos fechas.
function antiguedad(ini, fin){
  const a1=+ini.slice(0,4), m1=+ini.slice(5,7), d1=+ini.slice(8,10);
  const a2=+fin.slice(0,4), m2=+fin.slice(5,7), d2=+fin.slice(8,10);
  let meses = (a2-a1)*12 + (m2-m1), dias = d2-d1;
  if(dias < 0){ meses--; dias += new Date(a2, m2-1, 0).getDate(); }
  if(meses < 0) { meses = 0; dias = 0; }
  return {meses, dias, anos: Math.floor(meses/12)};
}
// Último aniversario del contrato antes del término: desde ahí se cuenta el feriado.
function ultimaAnualidad(ini, fin){
  const a = antiguedad(ini, fin);
  if(a.meses < 12) return ini;
  const n = Math.floor(a.meses/12);
  const d = new Date(+ini.slice(0,4)+n, +ini.slice(5,7)-1, +ini.slice(8,10));
  return d.toISOString().slice(0,10);
}
// Los días hábiles de feriado se cuentan desde el día siguiente al término,
// y al pagarlos se agregan los sábados, domingos y festivos del tramo (Art. 69:
// el sábado se considera siempre inhábil).
function habilesACorridos(fin, habiles, festivos){
  const enteros = Math.floor(habiles + 1e-9), frac = habiles - enteros;
  if(enteros <= 0) return {corridos: Math.round(frac*100)/100, hasta: fin};
  const d = new Date(fin+'T12:00:00'); let corridos = 0, contados = 0;
  while(contados < enteros && corridos < 400){
    d.setDate(d.getDate()+1); corridos++;
    const dw = d.getDay();
    if(dw !== 0 && dw !== 6) contados++;
  }
  corridos += Math.max(0, parseInt(festivos)||0);
  return {corridos: Math.round((corridos+frac)*100)/100, hasta: d.toISOString().slice(0,10)};
}

function finiquito(F){
  const P = prev(F.fin), uf = num(S.par.uf), utm = num(S.par.utm);
  const C = causal(F.causal);
  const base = R(num(F.base));                 // última remuneración mensual, Art. 172
  const valorDia = base/30;
  const ant = antiguedad(F.ini, F.fin);

  // 1. Remuneraciones del mes de término
  const diasMes = Math.max(0, Math.min(30, parseInt(F.diasTrabajados)||0));
  const remMes = R(valorDia * diasMes);

  // 2. Feriado proporcional
  const desdeFeriado = ultimaAnualidad(F.ini, F.fin);
  const af = antiguedad(desdeFeriado, F.fin);
  const porMes = num(F.diasFeriadoAno)/12;                       // 15/12 = 1,25 general
  const devengados = porMes*af.meses + (porMes/30)*af.dias;
  const tomados = num(F.diasTomados);
  const habiles = Math.max(0, devengados - tomados);
  const conv = habilesACorridos(F.fin, habiles, F.festivos);
  const feriado = R(valorDia * conv.corridos);

  // 3. Indemnización por años de servicio (Art. 163). Solo causal del 161,
  //    con un año o más de antigüedad, tope de 11 años y base topada en 90 UF.
  const topeUF = 90, topeBase = R(topeUF*uf);
  const baseIndem = Math.min(base, topeBase);
  // "Fracción superior a seis meses": seis meses y un día ya cuentan como año
  // completo, así que hay que mirar también los días residuales.
  let anosIAS = ant.anos;
  const mesesFrac = ant.meses % 12;
  if(mesesFrac > 6 || (mesesFrac === 6 && ant.dias > 0)) anosIAS++;
  anosIAS = Math.min(anosIAS, 11);
  const aplicaIAS = C.ias && ant.meses >= 12;
  const ias = aplicaIAS ? R(baseIndem * anosIAS) : 0;

  // 4. Indemnización sustitutiva del aviso previo (Art. 162)
  const aplicaAviso = C.aviso && !F.avisoDado;
  const aviso = aplicaAviso ? baseIndem : 0;

  // 5. Recargo del Art. 168: solo si un tribunal declara injustificado el despido
  const recargoPct = num(F.recargo)/100;
  const recargo = recargoPct ? R(ias * recargoPct) : 0;

  // Imponible y tributable: las remuneraciones y el feriado sí; las
  // indemnizaciones legales no (Art. 178 de la Ley de la Renta).
  const imponible = remMes + (F.feriadoImponible ? feriado : 0);
  const riAfp = Math.min(imponible, R(P.topes.afp*uf));
  const riAfc = Math.min(imponible, R(P.topes.afc*uf));
  const afp = R(riAfp * num(F.afp));
  const salud = R(riAfp * P.salud);
  const afcTrab = F.contrato==='indefinido' ? R(riAfc * P.afc.indefTrab) : 0;
  const cotiz = afp + salud + afcTrab;
  const baseTrib = Math.max(imponible - cotiz, 0);
  const iusc = porTabla(baseTrib, utm, P.iusc);

  // Art. 13 Ley 19.728: el saldo de la cuenta individual financiado por el
  // empleador se imputa a la indemnización por años de servicio.
  const afcImputado = Math.min(R(num(F.afcSaldo)), ias + recargo);
  const otros = R(num(F.otrosDesc));

  const haberes = remMes + feriado + ias + aviso + recargo;
  const descuentos = cotiz + iusc + afcImputado + otros;
  const total = haberes - descuentos;

  return {C, base, valorDia, ant, anosIAS, aplicaIAS, aplicaAviso, topeBase, baseIndem, topado: base>topeBase,
          diasMes, remMes, desdeFeriado, af, devengados, tomados, habiles, conv, feriado,
          ias, aviso, recargo, imponible, afp, salud, afcTrab, cotiz, baseTrib, iusc,
          afcImputado, otros, haberes, descuentos, total,
          plazoPago: (()=>{ const d=new Date(F.fin+'T12:00:00'); let h=0;
            while(h<10){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) h++; }
            return d.toISOString().slice(0,10); })()};
}

function asientosFiniquito(F, q){
  const quien = F.nombre ? ' de ' + F.nombre : '';
  const mes = MESES[+F.fin.slice(5,7)-1] + ' ' + F.fin.slice(0,4);
  const indem = q.ias + q.aviso + q.recargo;
  const L = [];
  if(q.remMes + q.feriado) L.push({c:'5102', d:q.remMes + q.feriado});
  if(indem) L.push({c:'5113', d:indem});
  if(q.afcImputado) L.push({c:'5113', h:q.afcImputado});   // el saldo AFC rebaja el gasto
  if(q.cotiz) L.push({c:'2106', h:q.cotiz});
  if(q.iusc)  L.push({c:'2105', h:q.iusc});
  if(q.otros) L.push({c:'1104', h:q.otros});
  L.push({c:'2104', h:q.total});
  const A = [{g:'Finiquito'+quien+' '+mes, l:L}];
  if(q.total>0) A.push({g:'Pago finiquito'+quien, l:[{c:'2104', d:q.total},{c:'1102', h:q.total}]});
  return A;
}

/* ---------------------- 9. cuadratura --------------------------------- */
function cuadratura(){
  const ym = ymActual(), lista = asientosHasta(ym);
  // movimiento neto de una cuenta, pudiendo filtrar por origen del asiento
  function movCta(cod, filtro){
    let d=0,h=0;
    lista.forEach(a=>{ if(filtro && !filtro(a)) return;
      a.lineas.forEach(l=>{ if(l.c===cod){ d+=num(l.d); h+=num(l.h); } }); });
    return {d, h, deudor:d-h, acreedor:h-d};
  }
  const noF29 = a => a.origen!=='f29';     // excluye la determinación mensual del IVA
  const soloDoc = a => a.origen==='doc';   // solo lo que vino de un documento

  const f = f29Ano().slice(0, S.ui.mes+1);
  const sum = k => f.reduce((a,r)=>a+r[k],0);
  const tVentas = sum('netoAfecto') + sum('netoExento');

  const cIngresos = movCta('4101').acreedor + movCta('4102').acreedor + movCta('4103').acreedor;
  const d = cuadraDiario(), b = esf(lista);

  const chk = [
    {n:'Partida doble del libro diario', t:d.debe, c:d.haber, duro:1,
     ex:'Suma del Debe contra suma del Haber de todos los asientos.'},
    {n:'Activo contra pasivo más patrimonio', t:b.activo, c:b.total, duro:1,
     ex:'Ecuación del estado de situación financiera.'},
    {n:'IVA débito fiscal', t:sum('debito'), c:movCta('2103',noF29).acreedor, duro:1,
     ex:'Débito del F29 contra el saldo que los documentos dejaron en la cuenta 2103.'},
    {n:'IVA crédito fiscal', t:sum('cred'), c:movCta('1106',noF29).deudor, duro:1,
     ex:'Crédito del F29 contra el saldo que los documentos dejaron en la cuenta 1106.'},
    {n:'Ventas netas y exentas', t:tVentas, c:cIngresos, duro:1,
     ex:'Base del registro de ventas contra los ingresos de las cuentas 4101, 4102 y 4103.'},
    {n:'Impuesto adicional DL 825 débito', t:sum('ilaD'), c:movCta('2109',noF29).acreedor, duro:1,
     ex:'Impuesto adicional recargado en ventas contra la cuenta 2109.'},
    {n:'Impuesto adicional DL 825 crédito', t:sum('ilaC'), c:movCta('1110',noF29).deudor, duro:1,
     ex:'Impuesto adicional soportado en compras contra la cuenta 1110.'},
    {n:'Retenciones de honorarios', t:sum('ret'), c:movCta('2105',soloDoc).acreedor, duro:0,
     ex:'Retenciones del F29 contra lo que las boletas de honorarios abonaron a la cuenta 2105.'},
    {n:'PPM enterados', t:sum('ppm'), c:movCta('1108').deudor, duro:0,
     ex:'PPM del F29 contra los cargos a la cuenta 1108.'}
  ];
  chk.forEach(x=>{
    x.t = R(x.t); x.c = R(x.c); x.dif = x.t - x.c;
    x.ok = Math.abs(x.dif) <= 2;
    x.nivel = x.ok ? 'ok' : (!x.duro && x.c === 0 ? 'pendiente' : 'error');
  });
  return {chk, tVentas, cIngresos,
          ok: chk.every(x=>x.nivel==='ok'),
          duroOk: chk.filter(x=>x.duro).every(x=>x.ok),
          pendientes: chk.filter(x=>x.nivel==='pendiente').length,
          errores: chk.filter(x=>x.nivel==='error').length};
}


/* ---------------------- 9b. revisores expertos ------------------------ */
// Dos motores de reglas. No son inteligencia artificial: son los criterios de
// NIIF para las PYMES y de la normativa tributaria chilena escritos como
// verificaciones, que se aplican sobre lo que hay en los libros.
// Cada hallazgo dice qué se detectó, por qué importa y qué hacer.

const NIVEL = {alto:'error', medio:'pendiente', bajo:'ok'};

function marcoAplicable(){
  // Art. 14 D: el Pro Pyme exige promedio de ingresos de 3 años bajo 75.000 UF,
  // sin superar 85.000 UF en ningún año, y capital efectivo inicial bajo 85.000 UF.
  const uf = num(S.par.uf) || 1;
  const ac = acumTrib();
  const ingUF = (ac.ventasNetas + ac.exentas) / uf;
  const declarado = num(S.emp.ingresosUFprev);      // promedio que cargó el usuario
  const base = declarado > 0 ? declarado : ingUF;
  let marco = 'pymes', motivo = 'Ingresos bajo el límite: corresponde NIIF para las PYMES.';
  if(base > 75000){ marco='plenas'; motivo='El promedio de ingresos supera las 75.000 UF: queda fuera del régimen Pro Pyme y corresponde presentar bajo NIIF completas.'; }
  else if(base > 60000){ marco='pymes'; motivo='Ingresos sobre 60.000 UF: te estás acercando al límite de 75.000 UF del Pro Pyme.'; }
  return {marco, motivo, ingUF, base, limite:75000, tope:85000,
          regimenCoherente: !(base > 75000 && S.emp.regimen !== '14A')};
}

function revisorContable(){
  const lista = asientosDelEjercicio(), m = saldos(lista);
  const sal = c => m[c] ? m[c].debe - m[c].haber : 0;
  const tiene = c => !!m[c];
  const E = esf(lista), r = eri(lista), M = marcoAplicable();
  const H = [];
  const add = (n, t, q, r2, acc) => H.push({nivel:n, t, q, r:r2, acc});

  if(M.marco === 'plenas')
    add('alto','El marco contable que corresponde es NIIF completas', M.motivo,
        'Bajo NIIF completas cambian la presentación y las revelaciones: estado de cambios en el patrimonio y flujo de efectivo obligatorios, deterioro de activos con test formal, y más notas. Este sistema arma los estados con el formato de NIIF PYMES.',
        'Habla con tu contador antes del cierre. Y revisa el régimen tributario: fuera del Pro Pyme corresponde el 14 A.');
  else if(M.base > 60000)
    add('medio','Te estás acercando al límite del Pro Pyme', M.motivo,
        'Si el promedio de tres años pasa de 75.000 UF, o un solo año pasa de 85.000, sales del régimen.',
        'Proyecta el cierre del año y prepara el cambio con tiempo. El plazo para optar por otro régimen vence el 30 de abril.');

  if(!M.regimenCoherente)
    add('alto','El régimen configurado no calza con tus ingresos',
        'La app está configurada en '+REG_CORTO[S.emp.regimen]+' pero los ingresos superan el límite del Pro Pyme.',
        'Se están calculando el IDPC y el PPM con una tasa que no corresponde.',
        'Cambia el régimen en Ajustes a Semi Integrado (Art. 14 A).');

  // saldos con signo contrario a su naturaleza
  const raros = [];
  Object.keys(m).forEach(c=>{
    const t = CTA[c]; if(!t) return;
    const v = sal(c);
    if(R(v)===0) return;
    const deudoraEsperada = esDeudora(t.tipo);
    if(t.tipo==='activoC' || t.tipo==='gasto' || t.tipo==='ingreso' || t.tipo==='patrimonioD') return;
    if(deudoraEsperada && v < -2) raros.push([c, t.nom, v, 'acreedor']);
    if(!deudoraEsperada && v > 2) raros.push([c, t.nom, v, 'deudor']);
  });
  if(raros.length)
    add('alto','Hay cuentas con saldo al revés de su naturaleza',
        raros.map(x=>x[0]+' '+x[1]+': saldo '+x[3]+' de '+fmt(Math.abs(x[2]))).join(' · '),
        'Un activo con saldo acreedor o un pasivo con saldo deudor casi siempre es un asiento mal imputado, o un pago registrado dos veces.',
        'Revisa el mayor de esas cuentas y busca el movimiento que las dio vuelta.');

  // existencias negativas
  if(sal('1105') < -2)
    add('alto','Las existencias quedaron en negativo',
        'La cuenta 1105 tiene saldo acreedor de '+fmt(Math.abs(sal('1105')))+'.',
        'Estás descargando más costo de venta del que entró como compra. NIIF PYMES sección 13 exige valorizar al menor entre costo y precio de venta estimado, y un saldo negativo no es valorizable.',
        'Revisa los costos de venta cargados en el importador: si vienen todos con el mismo monto, corrígelos.');

  // activo fijo sin depreciación
  const af = sal('1201')+sal('1202')+sal('1203');
  if(af > 0 && !tiene('5107'))
    add('medio','Hay activo fijo y no hay depreciación del ejercicio',
        'Activos por '+fmt(af)+' sin ningún cargo a la cuenta 5107.',
        'NIIF PYMES sección 17 obliga a depreciar sistemáticamente sobre la vida útil. Sin depreciación el resultado queda sobrevalorado y el activo también.',
        'Usa la plantilla de depreciación en el libro diario, una vez al mes o al cierre del año.');

  // remuneraciones sin provisión de vacaciones
  if(tiene('5102') && !tiene('2107'))
    add('medio','Hay remuneraciones y no hay provisión de vacaciones',
        'La cuenta 5102 tiene movimientos y la 2107 está vacía.',
        'El feriado se devenga mes a mes aunque se tome después. NIIF PYMES sección 28 exige reconocer el beneficio cuando el trabajador presta el servicio, no cuando se paga.',
        'Provisiona 1,25 días de sueldo por trabajador por mes con la plantilla de provisión de vacaciones.');

  // clientes sin estimación de incobrables
  if(sal('1103') > 0 && !tiene('1109'))
    add('bajo','Cuentas por cobrar sin estimación de incobrables',
        'Clientes por '+fmt(sal('1103'))+' sin ninguna estimación registrada.',
        'NIIF PYMES sección 11 pide evaluar el deterioro de los activos financieros al cierre de cada período.',
        'Si hay facturas antiguas o clientes con problemas, registra la estimación con la plantilla correspondiente.');

  // gastos financieros sin deuda
  if(tiene('5106') && sal('2201')+sal('2102') >= 0 && !tiene('2201'))
    add('bajo','Hay gastos financieros sin deuda registrada',
        'Intereses por '+fmt(sal('5106'))+' y ninguna obligación financiera en el balance.',
        'O la deuda no está contabilizada, o esos intereses son comisiones bancarias y van a gastos generales.',
        'Revisa el origen: si es un crédito, regístralo; si es comisión, reclasifícala a la 5104.');

  // sin provisión de impuesto al cierre
  if(S.ui.mes >= 11 && r.antesImp > 0 && !tiene('5112'))
    add('medio','Falta la provisión del impuesto a la renta',
        'Resultado antes de impuesto de '+fmt(r.antesImp)+' sin cargo a la cuenta 5112.',
        'NIIF PYMES sección 29 exige reconocer el impuesto del período en el mismo ejercicio en que se devenga.',
        'Usa la plantilla de provisión del impuesto a la renta con el monto que calcula la pestaña Planificación.');

  // retiros por sobre las utilidades
  const utilDisp = sal('3102')*-1 + r.neto;
  if(E.ret > 0 && E.ret > utilDisp && utilDisp >= 0)
    add('medio','Los retiros superan las utilidades disponibles',
        'Retiros por '+fmt(E.ret)+' contra utilidades de '+fmt(utilDisp)+'.',
        'Retirar más de lo generado descapitaliza la empresa, y tributariamente puede quedar como retiro con cargo a capital o generar diferencias en el registro de rentas.',
        'Revísalo con tu contador antes del cierre.');

  // deuda de largo plazo que vence pronto
  if(sal('2201') < -2 && S.ui.mes >= 9)
    add('bajo','Revisa la porción corriente de la deuda de largo plazo',
        'Préstamos a largo plazo por '+fmt(Math.abs(sal('2201')))+'.',
        'NIIF PYMES sección 4 exige presentar como pasivo corriente la parte que vence dentro de los próximos 12 meses.',
        'Reclasifica al pasivo corriente las cuotas del próximo año.');

  // banco sin conciliar
  if(tiene('1102') && !(S.banco.movs||[]).length)
    add('bajo','La cuenta banco no está conciliada',
        'Hay movimientos en la 1102 y ninguna cartola cargada.',
        'Sin conciliación no hay forma de saber si el saldo contable refleja el saldo real.',
        'Sube la cartola en la pestaña Banco.');

  // documentos importados todos a la misma cuenta
  const porCta = {};
  S.docs.filter(d=>d.importado && d.clase==='compra').forEach(d=>{ porCta[d.cuenta]=(porCta[d.cuenta]||0)+1; });
  const ctasImp = Object.keys(porCta);
  if(ctasImp.length===1 && porCta[ctasImp[0]] >= 8)
    add('medio','Todas las compras importadas quedaron en una sola cuenta',
        porCta[ctasImp[0]]+' documentos cargados a '+ctasImp[0]+' '+nomCta(ctasImp[0])+'.',
        'Al importar del SII todos los documentos van a la misma cuenta. Si mezclas mercadería con gastos, el costo de venta y el margen quedan mal.',
        'Revisa el libro diario y reimputa las que correspondan a otra cuenta.');

  H.sort((a,b)=> ({alto:0,medio:1,bajo:2})[a.nivel] - ({alto:0,medio:1,bajo:2})[b.nivel]);
  return {H, M, E, r};
}

function revisorTributario(){
  const A = f29Ano(), idx = S.ui.mes, f = A[idx];
  const R0 = renta(), cu = cuadratura();
  const H = [];
  const add = (n, t, q, r2, acc) => H.push({nivel:n, t, q, r:r2, acc});

  // el F29 contra la contabilidad
  const dur = cu.chk.filter(x=>x.duro && !x.ok);
  if(dur.length)
    add('alto','El F29 no calza con la contabilidad',
        dur.map(x=>x.n+': diferencia de '+fmt(Math.abs(x.dif))).join(' · '),
        'Si declaras un débito o un crédito distinto del que está en tus libros, la diferencia aparece en una fiscalización.',
        'Revisa la pestaña Cuadratura antes de declarar.');

  // remanente creciente
  const rem = A.slice(0, idx+1).map(x=>x.remanenteSig);
  const creciendo = rem.length>=3 && rem[idx] > 0 && rem[idx] > rem[idx-1] && rem[idx-1] > rem[idx-2];
  if(creciendo)
    add('medio','El remanente de crédito fiscal viene creciendo',
        'Tres meses seguidos al alza, hoy en '+fmt(rem[idx])+'.',
        'Un remanente que solo sube suele venir de compras de activo fijo, de ventas exentas, o de facturas cargadas dos veces. No es un gasto: es un activo que estás acumulando.',
        'Revisa las compras del período. Si viene de activo fijo, considera el Art. 27 bis para recuperarlo anticipadamente.');

  // PPM que no cubren el impuesto
  if(R0.idpc > 0 && R0.saldo > R0.idpc*0.4)
    add('medio','Los PPM van a quedar muy cortos en abril',
        'Impuesto proyectado de '+fmt(R0.idpc)+' contra PPM de '+fmt(R0.ppm)+': faltarían '+fmt(R0.saldo)+'.',
        'El saldo se paga de una vez en abril. Llegar sin haberlo previsto es un problema de caja, no de impuestos.',
        'Puedes aumentar voluntariamente la tasa de PPM en el F29 para repartir el golpe en los meses que quedan.');
  if(R0.idpc > 0 && R0.saldo < -R0.idpc*0.5)
    add('bajo','Los PPM superan bastante el impuesto proyectado',
        'Devolución estimada de '+fmt(Math.abs(R0.saldo))+'.',
        'Es plata tuya adelantada al fisco sin interés hasta mayo.',
        'Si la tendencia se mantiene, evalúa rebajar la tasa de PPM.');

  // ventas sin documentos pero con asientos
  if(f.debito === 0 && f.netoAfecto === 0 && S.ui.mes <= new Date().getMonth())
    add('medio','No hay ventas registradas en el mes',
        'El F29 de '+MESES[idx]+' quedaría en cero por el lado del débito.',
        'Si hubo ventas y no están cargadas, la declaración va incompleta.',
        'Importa el registro de ventas del SII en la pestaña Documentos.');

  // honorarios sin enterar
  const retAcum = A.slice(0, idx+1).reduce((a,x)=>a+x.ret,0);
  const mov2105 = (()=>{ let d=0; asientosDelEjercicio().forEach(a=>a.lineas.forEach(l=>{ if(l.c==='2105') d+=num(l.d); })); return d; })();
  if(retAcum > 0 && mov2105 === 0)
    add('alto','Hay retenciones de honorarios sin enterar',
        'Retenciones por '+fmt(retAcum)+' y ningún pago registrado.',
        'La retención del Art. 74 N°2 se entera en el F29 del mes siguiente. No enterarla genera multas e intereses.',
        'Usa la plantilla de entero de retenciones en el libro diario.');

  // impuestos adicionales
  const ila = A.slice(0, idx+1).reduce((a,x)=>a+Math.max(x.ilaNeto,0),0);
  if(ila > 0)
    add('bajo','Tienes impuestos adicionales del DL 825 por enterar',
        'Acumulado del año: '+fmt(ila)+'.',
        'El ILA se declara en el F29 junto con el IVA, en sus propias líneas.',
        'Verifica que las tasas aplicadas correspondan al producto: 20,5% cervezas y vinos, 31,5% destilados, 10% o 18% analcohólicas.');

  // gastos rechazados sin declarar
  if(num(S.ajustes.gastosRechazados) === 0 && S.ui.mes >= 10)
    add('bajo','No has cargado gastos rechazados',
        'La RLI se está calculando sin agregados del Art. 33 N°1.',
        'Multas, gastos sin respaldo, gastos de vehículos no permitidos y retiros en especie deben agregarse a la RLI. Además tributan con el impuesto único del Art. 21.',
        'Revísalos antes del cierre y cárgalos en Planificación.');

  H.sort((a,b)=> ({alto:0,medio:1,bajo:2})[a.nivel] - ({alto:0,medio:1,bajo:2})[b.nivel]);
  return {H, DJ: declaracionesJuradas(), R0, f};
}

/* ---------------------- 10. vencimientos ------------------------------ */
function vencimientos(){
  const hoy = new Date(), y = hoy.getFullYear(), m = hoy.getMonth();
  const mk = (dd, mm, yy, t, q) => ({f:new Date(yy, mm, dd), t, q});
  const L = [
    mk(12, m, y, 'F29 del mes anterior', 'declaración y pago por internet'),
    mk(20, m, y, 'F29 del mes anterior', 'plazo ampliado para facturadores electrónicos que declaran y pagan por internet'),
    mk(13, m, y, 'Cotizaciones previsionales', 'pago en Previred'),
    mk(30, 3, y, 'Formulario 22 — Renta', 'declaración anual del año comercial anterior'),
    mk(31, 2, y, 'Declaraciones juradas', 'DJ 1847, 1887, 1948 y las demás de marzo'),
    mk(30, 3, y, 'Cambio de régimen tributario', 'último día para optar por otro régimen')
  ];
  L.forEach(x=>{ if(x.f < hoy){ if(x.t.indexOf('F29')===0 || x.t.indexOf('Cotiz')===0) x.f.setMonth(x.f.getMonth()+1); else x.f.setFullYear(x.f.getFullYear()+1); } });
  L.sort((a,b)=>a.f-b.f);
  L.forEach(x=> x.dias = Math.ceil((x.f - hoy)/86400000));
  return L.slice(0,5);
}
